name: Build Android APK & Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.27.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Recreate Clean Android Platform & Inject Fixed Keystore + Native Bridge v2.7.0

        run: |
          rm -rf android
          flutter create --platforms=android --org com.mayak.mesh --project-name=p2p_mesh .
          python3 -c '
          import base64, glob, os, re

          # 0. Восстанавливаем фиксированный ключ подписи mayak_release.jks (100% идентичный v1.4.0)
          ks_b64 = ""
          os.makedirs("android/app", exist_ok=True)
          with open("android/app/mayak_release.jks", "wb") as kf:
              kf.write(base64.b64decode(ks_b64))

          # Автоинкремент versionCode от номера сборки GitHub Actions, чтобы каждый новый APK всегда имел больший versionCode и обновлялся поверх старого без конфликта!
          run_num = int(os.environ.get("GITHUB_RUN_NUMBER", "1") or "1")
          ver_code = 1500 + run_num

          # 1. Настраиваем gradle.properties
          gp_path = "android/gradle.properties"
          gp_content = ""
          if os.path.exists(gp_path):
              with open(gp_path, "r") as f:
                  gp_content = f.read()
          if "android.enableR8.fullMode" not in gp_content:
              gp_content += "\nandroid.enableR8.fullMode=false\n"
          with open(gp_path, "w") as f:
              f.write(gp_content)

          # 2. Обновляем settings.gradle / settings.gradle.kts (AGP 8.7.0, Kotlin 2.1.0)
          for s in ["android/settings.gradle", "android/settings.gradle.kts"]:
              if os.path.exists(s):
                  with open(s, "r") as f:
                      sc = f.read()
                  sc = re.sub(
                      r"(id\s*[\(\"\x27]+com\.android\.application[\)\"\x27]+\s+version\s+[\"\x27])[^\"\x27]+([\"\x27])",
                      r"\g<1>8.7.0\g<2>",
                      sc
                  )
                  sc = re.sub(
                      r"(id\s*[\(\"\x27]+org\.jetbrains\.kotlin\.android[\)\"\x27]+\s+version\s+[\"\x27])[^\"\x27]+([\"\x27])",
                      r"\g<1>2.1.0\g<2>",
                      sc
                  )
                  with open(s, "w") as f:
                      f.write(sc)

          # 3. Обновляем Gradle Wrapper до 8.9
          gw = "android/gradle/wrapper/gradle-wrapper.properties"
          if os.path.exists(gw):
              with open(gw, "r") as f:
                  gwc = f.read()
              gwc = re.sub(
                  r"distributionUrl=.*gradle-[0-9.]+-all\.zip",
                  "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip",
                  gwc
              )
              with open(gw, "w") as f:
                  f.write(gwc)

          # 4. Переписываем android/app/build.gradle(.kts) с фиксированной подписью mayak_release.jks и растущим versionCode
          kts_path = "android/app/build.gradle.kts"
          groovy_path = "android/app/build.gradle"

          if os.path.exists(kts_path):
              with open(kts_path, "w") as f:
                  f.write(f"""plugins {{
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }}

          android {{
              namespace = "com.mayak.mesh.p2p_mesh"
              compileSdk = 36

              compileOptions {{
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }}

              kotlinOptions {{
                  jvmTarget = "17"
              }}

              signingConfigs {{
                  create("mayakFixed") {{
                      storeFile = file("mayak_release.jks")
                      storePassword = "mayak2026"
                      keyAlias = "mayak_key"
                      keyPassword = "mayak2026"
                      enableV1Signing = true
                      enableV2Signing = true
                  }}
              }}

              defaultConfig {{
                  applicationId = "com.mayak.mesh.p2p_mesh"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = {ver_code}
                  versionName = "2.9.0"
              }}

              packaging {{
                  jniLibs {{
                      useLegacyPackaging = true
                  }}
              }}

              buildTypes {{
                  getByName("debug") {{
                      signingConfig = signingConfigs.getByName("mayakFixed")
                  }}
                  getByName("release") {{
                      signingConfig = signingConfigs.getByName("mayakFixed")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }}
              }}
          }}

          flutter {{
              source = "../.."
          }}

          dependencies {{
              implementation("com.google.android.gms:play-services-nearby:19.3.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }}
          """)
          elif os.path.exists(groovy_path):
              with open(groovy_path, "w") as f:
                  f.write(f"""plugins {{
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }}

          android {{
              namespace "com.mayak.mesh.p2p_mesh"
              compileSdk 36

              compileOptions {{
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }}

              kotlinOptions {{
                  jvmTarget = "17"
              }}

              signingConfigs {{
                  mayakFixed {{
                      storeFile file("mayak_release.jks")
                      storePassword "mayak2026"
                      keyAlias "mayak_key"
                      keyPassword "mayak2026"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }}
              }}

              defaultConfig {{
                  applicationId "com.mayak.mesh.p2p_mesh"
                  minSdkVersion 23
                  targetSdkVersion 34
                  versionCode {ver_code}
                  versionName "2.9.0"
              }}

              packagingOptions {{
                  jniLibs {{
                      useLegacyPackaging true
                  }}
              }}

              buildTypes {{
                  debug {{
                      signingConfig signingConfigs.mayakFixed
                  }}
                  release {{
                      signingConfig signingConfigs.mayakFixed
                      minifyEnabled false
                      shrinkResources false
                  }}
              }}
          }}

          flutter {{
              source "../.."
          }}

          dependencies {{
              implementation "com.google.android.gms:play-services-nearby:19.3.0"
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
          }}
          """)

          # 5. Записываем AndroidManifest.xml (с allowBackup=true)
          res_xml_dir = "android/app/src/main/res/xml"
          os.makedirs(res_xml_dir, exist_ok=True)
          with open(os.path.join(res_xml_dir, "file_paths.xml"), "w") as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
              <external-path name="external" path="." />
          </paths>
          """)

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          os.makedirs(os.path.dirname(manifest_path), exist_ok=True)
          with open(manifest_path, "w") as f:
              f.write("""<manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false"/>
              <uses-feature android:name="android.hardware.bluetooth" android:required="false"/>
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false"/>
              <uses-feature android:name="android.hardware.wifi" android:required="false"/>
              <uses-feature android:name="android.hardware.microphone" android:required="false"/>

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_REMOTE_MESSAGING"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>

              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:label="Маяк P2P"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:fullBackupContent="true"
                  android:usesCleartextTraffic="true"
                  android:enableOnBackInvokedCallback="true">

                  <meta-data
                      android:name="io.flutter.embedding.android.EnableImpeller"
                      android:value="false" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <service
                      android:name=".MayakBackgroundService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="remoteMessaging|dataSync" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          """)

          # 6. Записываем MainActivity.kt (с синхронным нативным хранилищем БД и генерацией превью в памяти без мусорных файлов)
          kt_files = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          kt_path = kt_files[0] if kt_files else "android/app/src/main/kotlin/com/mayak/mesh/p2p_mesh/MainActivity.kt"
          os.makedirs(os.path.dirname(kt_path), exist_ok=True)
          with open(kt_path, "w") as f:
              f.write("""package com.mayak.mesh.p2p_mesh

          import android.Manifest
          import android.app.Activity
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.database.Cursor
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.location.LocationManager
          import android.media.AudioAttributes
          import android.media.MediaMetadataRetriever
          import android.media.MediaPlayer
          import android.media.MediaRecorder
          import android.media.RingtoneManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import android.provider.Settings
          import android.util.Base64
          import android.view.Surface
          import android.webkit.MimeTypeMap
          import androidx.core.app.ActivityCompat
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import androidx.core.content.FileProvider
          import com.google.android.gms.nearby.Nearby
          import com.google.android.gms.nearby.connection.AdvertisingOptions
          import com.google.android.gms.nearby.connection.ConnectionInfo
          import com.google.android.gms.nearby.connection.ConnectionLifecycleCallback
          import com.google.android.gms.nearby.connection.ConnectionResolution
          import com.google.android.gms.nearby.connection.DiscoveredEndpointInfo
          import com.google.android.gms.nearby.connection.DiscoveryOptions
          import com.google.android.gms.nearby.connection.EndpointDiscoveryCallback
          import com.google.android.gms.nearby.connection.Payload
          import com.google.android.gms.nearby.connection.PayloadCallback
          import com.google.android.gms.nearby.connection.PayloadTransferUpdate
          import com.google.android.gms.nearby.connection.Strategy
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import io.flutter.view.TextureRegistry
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.util.Locale
          import kotlin.system.exitProcess

          class MayakBackgroundService : Service() {
              companion object {
                  const val ACTION_STOP_SERVICE = "com.mayak.mesh.STOP_SERVICE"
                  var instance: MayakBackgroundService? = null
              }

              private var wakeLock: PowerManager.WakeLock? = null
              private var wifiLock: WifiManager.WifiLock? = null

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val chan = NotificationChannel(
                              "mayak_bg_service",
                              "Фоновое дежурство Маяк P2P",
                              NotificationManager.IMPORTANCE_LOW
                          ).apply {
                              description = "Поддерживает работу узла связи при выключенном экране"
                              setShowBadge(false)
                          }
                          val nm = getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                          nm?.createNotificationChannel(chan)
                      }

                      val openIntent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      val pFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                      val pendingOpen = PendingIntent.getActivity(this, 0, openIntent, pFlags)

                      val stopIntent = Intent(this, MayakBackgroundService::class.java).apply {
                          action = ACTION_STOP_SERVICE
                      }
                      val pendingStop = PendingIntent.getService(this, 1, stopIntent, pFlags)

                      val notif = NotificationCompat.Builder(this, "mayak_bg_service")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle("Маяк P2P на дежурстве")
                          .setContentText("Ожидание сообщений (0% нагрузки CPU)")
                          .setOngoing(true)
                          .setPriority(NotificationCompat.PRIORITY_LOW)
                          .setContentIntent(pendingOpen)
                          .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Выключить и выйти", pendingStop)
                          .build()

                      if (Build.VERSION.SDK_INT >= 34) {
                          try {
                              startForeground(9001, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_REMOTE_MESSAGING)
                          } catch (_: Throwable) {
                              startForeground(9001, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                          }
                      } else {
                          startForeground(9001, notif)
                      }

                      val pm = getSystemService(Context.POWER_SERVICE) as? PowerManager
                      wakeLock = pm?.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Mayak::BgWakeLock")?.apply {
                          setReferenceCounted(false)
                          acquire()
                      }

                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                      if (wm != null && wm.isWifiEnabled) {
                          wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "Mayak::BgWifiLock")?.apply {
                              setReferenceCounted(false)
                              acquire()
                          }
                      }
                  } catch (_: Throwable) {}
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP_SERVICE) {
                      stopAndExitCompletely()
                      return START_NOT_STICKY
                  }
                  return START_STICKY
              }

              fun stopAndExitCompletely() {
                  try {
                      if (wakeLock?.isHeld == true) wakeLock?.release()
                      if (wifiLock?.isHeld == true) wifiLock?.release()
                  } catch (_: Throwable) {}
                  try {
                      Nearby.getConnectionsClient(applicationContext).stopAllEndpoints()
                      Nearby.getConnectionsClient(applicationContext).stopAdvertising()
                      Nearby.getConnectionsClient(applicationContext).stopDiscovery()
                  } catch (_: Throwable) {}
                  try {
                      MainActivity.currentInstance?.finishAffinity()
                  } catch (_: Throwable) {}
                  stopForeground(true)
                  stopSelf()
                  exitProcess(0)
              }

              override fun onDestroy() {
                  instance = null
                  try {
                      if (wakeLock?.isHeld == true) wakeLock?.release()
                      if (wifiLock?.isHeld == true) wifiLock?.release()
                  } catch (_: Throwable) {}
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }

          class MainActivity : FlutterActivity() {
              companion object {
                  var currentInstance: MainActivity? = null
              }

              private val CHANNEL = "mayak/native"
              private val NOTIF_CHANNEL_ID = "mayak_poco_high_alert_v3"
              private var methodChannel: MethodChannel? = null
              private var flutterEngineRef: FlutterEngine? = null
              private var multicastLock: WifiManager.MulticastLock? = null
              private var pendingPermResult: MethodChannel.Result? = null
              private var pendingFilePickResult: MethodChannel.Result? = null
              private var localNodeId: String = ""
              private var serviceId: String = "com.p2pmesh.intercom"
              private var notifIdCounter = 1001
              private var isAppInForeground = true

              private var mediaRecorder: MediaRecorder? = null
              private var currentVoiceFilePath: String? = null
              private var voiceStartMs: Long = 0L
              private var audioPlayer: MediaPlayer? = null
              private var currentAudioPath: String? = null

              private var videoTextureEntry: TextureRegistry.SurfaceTextureEntry? = null
              private var videoSurface: Surface? = null
              private var videoPlayer: MediaPlayer? = null
              private var videoCompletedFlag: Boolean = false

              private val connectedBleEndpoints = mutableSetOf<String>()
              private val pendingBleEndpoints = mutableSetOf<String>()
              private var pendingNearbyAutoStart: Boolean = false
              // v2.0.1: Нативный Bluetooth RFCOMM-движок (резерв к Google Nearby — работает без GPS и без Google Play Services!)
              private val btRfcommUuid: java.util.UUID = java.util.UUID.fromString("a7e3c510-8b2d-4c9a-9f11-420690000001")
              private val btMeshRunning = java.util.concurrent.atomic.AtomicBoolean(false)
              private var btServerSocket: android.bluetooth.BluetoothServerSocket? = null
              private val btSockets = java.util.concurrent.ConcurrentHashMap<String, android.bluetooth.BluetoothSocket>()
              private val btWriteExec = java.util.concurrent.Executors.newSingleThreadExecutor()
              @Volatile private var lastPressureHpa: Double = 0.0
              private var baroListenerRegistered: Boolean = false
              @Volatile private var lastLiveLocation: android.location.Location? = null
              private var locListenerRegistered: Boolean = false
              private val mainHandler = Handler(Looper.getMainLooper())

              // v1.8.0: Полнодуплексный аудио/видео движок звонков + рингтон и гудки
              private val callAudioRunning = java.util.concurrent.atomic.AtomicBoolean(false)
              private val callAudioMuted = java.util.concurrent.atomic.AtomicBoolean(false)
              private val callSpeakerEnabled = java.util.concurrent.atomic.AtomicBoolean(true)
              private var callAudioRecord: android.media.AudioRecord? = null
              private var callAudioTrack: android.media.AudioTrack? = null
              private var callAec: android.media.audiofx.AcousticEchoCanceler? = null
              private var callNs: android.media.audiofx.NoiseSuppressor? = null
              private val callPlayQueue = java.util.concurrent.LinkedBlockingQueue<ByteArray>(24)

              @Suppress("DEPRECATION")
              private var callCamera: android.hardware.Camera? = null
              private var callCameraSurface: android.graphics.SurfaceTexture? = null
              private val callCameraRunning = java.util.concurrent.atomic.AtomicBoolean(false)
              private val callCameraEncoding = java.util.concurrent.atomic.AtomicBoolean(false)
              private var callCameraFront: Boolean = true
              private var lastCallFrameMs: Long = 0L
              private var callCameraOrientation: Int = 270

              private var incomingRingtone: android.media.Ringtone? = null
              private val ringbackRunning = java.util.concurrent.atomic.AtomicBoolean(false)
              private var ringbackToneGen: android.media.ToneGenerator? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  currentInstance = this
                  createNotificationChannel()
                  val defaultHandler = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
                      try {
                          mainHandler.post {
                              methodChannel?.invokeMethod("onNativeLog", "Перехвачена ошибка [${thread.name}]: ${throwable.message}")
                          }
                      } catch (_: Throwable) {}
                      if (thread.name != "main") {
                          return@setDefaultUncaughtExceptionHandler
                      }
                      defaultHandler?.uncaughtException(thread, throwable)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  isAppInForeground = true
              }

              override fun onPause() {
                  isAppInForeground = false
                  super.onPause()
              }

              override fun onStop() {
                  isAppInForeground = false
                  super.onStop()
              }

              private fun createNotificationChannel() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                          val audioAttr = AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION_COMMUNICATION_INSTANT)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build()
                          val channel = NotificationChannel(
                              NOTIF_CHANNEL_ID,
                              "Экстренные сообщения Маяк (POCO/MIUI)",
                              NotificationManager.IMPORTANCE_HIGH
                          ).apply {
                              description = "Пробивные уведомления о сообщениях со звуком и вибрацией"
                              enableVibration(true)
                              vibrationPattern = longArrayOf(0, 280, 120, 280)
                              lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                              setBypassDnd(true)
                              setSound(soundUri, audioAttr)
                          }
                          val nm = getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                          nm?.createNotificationChannel(channel)
                      }
                  } catch (_: Throwable) {}
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  flutterEngineRef = flutterEngine
                  val channel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                  methodChannel = channel

