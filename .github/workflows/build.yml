name: Build Android APK & Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create Android/Windows platform folders if missing
        run: |
          flutter create --platforms=android,windows --project-name=p2p_mesh .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK (Split per ABI + Universal)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2p-mesh-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Create Windows platform folder if missing
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=p2p_mesh .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: p2p-mesh-windows-pc
          path: build/windows/x64/runner/Release/
