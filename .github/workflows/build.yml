              // Синхронное атомарное сохранение БД чатов и контактов (SharedPreferences.commit() + атомарный файл)
              @Synchronized
              private fun saveNativeDbSynchronously(jsonStr: String): Boolean {
                  if (jsonStr.isBlank()) return false
                  return try {
                      val sp = applicationContext.getSharedPreferences("mayak_native_db_v15", Context.MODE_PRIVATE)
                      sp.edit().putString("master_json", jsonStr).commit()

                      val dataDir = File(filesDir, "mayak_data").apply { mkdirs() }
                      val tmpFile = File(dataDir, "mayak_store_v15.json.tmp")
                      val targetFile = File(dataDir, "mayak_store_v15.json")
                      val bakFile = File(dataDir, "mayak_store_v15.bak.json")
                      tmpFile.writeText(jsonStr, Charsets.UTF_8)
                      if (targetFile.exists() && targetFile.length() > 20) {
                          targetFile.copyTo(bakFile, overwrite = true)
                      }
                      tmpFile.copyTo(targetFile, overwrite = true)
                      tmpFile.delete()
                      true
                  } catch (_: Throwable) {
                      false
                  }
              }

              private fun saveBytesToDownloadsInternal(bytes: ByteArray, fileName: String): String {
                  return try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = android.content.ContentValues().apply {
                              put(android.provider.MediaStore.Downloads.DISPLAY_NAME, fileName)
                              put(android.provider.MediaStore.Downloads.MIME_TYPE, "application/octet-stream")
                              put(android.provider.MediaStore.Downloads.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS + "/Mayak")
                          }
                          val uri = contentResolver.insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                          if (uri != null) {
                              contentResolver.openOutputStream(uri)?.use { it.write(bytes) }
                              return "Загрузки/Mayak/$fileName"
                          }
                      }
                      val dlDir = File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS), "Mayak")
                      if (!dlDir.exists()) dlDir.mkdirs()
                      val outFile = File(dlDir, fileName)
                      outFile.writeBytes(bytes)
                      outFile.absolutePath
                  } catch (_: Throwable) {
                      val fallbackDir = File(getExternalFilesDir(android.os.Environment.DIRECTORY_DOWNLOADS) ?: filesDir, "Mayak")
                      if (!fallbackDir.exists()) fallbackDir.mkdirs()
                      val outFile = File(fallbackDir, fileName)
                      outFile.writeBytes(bytes)
                      outFile.absolutePath
                  }
              }

              @Suppress("MissingPermission")
              private fun ensureLiveLocationUpdates() {
                  if (locListenerRegistered) return
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      return
                  }
                  try {
                      val lm = getSystemService(Context.LOCATION_SERVICE) as? android.location.LocationManager ?: return
                      locListenerRegistered = true
                      val listener = object : android.location.LocationListener {
                          override fun onLocationChanged(location: android.location.Location) {
                              lastLiveLocation = location
                          }
                          @Deprecated("Deprecated in Java")
                          override fun onStatusChanged(provider: String?, status: Int, extras: Bundle?) {}
                          override fun onProviderEnabled(provider: String) {}
                          override fun onProviderDisabled(provider: String) {}
                      }
                      mainHandler.post {
                          try {
                              if (lm.isProviderEnabled(android.location.LocationManager.GPS_PROVIDER)) {
                                  lm.requestLocationUpdates(android.location.LocationManager.GPS_PROVIDER, 3000L, 1f, listener, Looper.getMainLooper())
                              }
                          } catch (_: Throwable) {}
                          try {
                              if (lm.isProviderEnabled(android.location.LocationManager.NETWORK_PROVIDER)) {
                                  lm.requestLocationUpdates(android.location.LocationManager.NETWORK_PROVIDER, 3000L, 2f, listener, Looper.getMainLooper())
                              }
                          } catch (_: Throwable) {}
                      }
                  } catch (_: Throwable) {}
              }

              @Suppress("MissingPermission")
              private fun getGeoAndBarometerInternal(): Map<String, Any> {
                  val out = mutableMapOf<String, Any>()
                  try {
                      if (!baroListenerRegistered) {
                          val sm = getSystemService(Context.SENSOR_SERVICE) as? android.hardware.SensorManager
                          val baro = sm?.getDefaultSensor(android.hardware.Sensor.TYPE_PRESSURE)
                          if (sm != null && baro != null) {
                              baroListenerRegistered = true
                              sm.registerListener(object : android.hardware.SensorEventListener {
                                  override fun onSensorChanged(event: android.hardware.SensorEvent?) {
                                      if (event != null && event.values.isNotEmpty()) {
                                          lastPressureHpa = event.values[0].toDouble()
                                      }
                                  }
                                  override fun onAccuracyChanged(sensor: android.hardware.Sensor?, accuracy: Int) {}
                              }, baro, android.hardware.SensorManager.SENSOR_DELAY_NORMAL)
                          }
                      }
                  } catch (_: Throwable) {}
                  out["hpa"] = lastPressureHpa

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      out["ok"] = false
                      out["err"] = "no_permission"
                      return out
                  }
                  ensureLiveLocationUpdates()
                  try {
                      val lm = getSystemService(Context.LOCATION_SERVICE) as? android.location.LocationManager
                      val candidates = mutableListOf<android.location.Location>()
                      lastLiveLocation?.let { candidates.add(it) }
                      for (prov in listOf(
                          android.location.LocationManager.GPS_PROVIDER,
                          android.location.LocationManager.NETWORK_PROVIDER,
                          android.location.LocationManager.PASSIVE_PROVIDER
                      )) {
                          try {
                              lm?.getLastKnownLocation(prov)?.let { candidates.add(it) }
                          } catch (_: Throwable) {}
                      }
                      val best = candidates.maxByOrNull { it.time }
                      if (best != null) {
                          out["ok"] = true
                          out["lat"] = best.latitude
                          out["lon"] = best.longitude
                          out["alt"] = if (best.hasAltitude()) best.altitude else 0.0
                          out["acc"] = best.accuracy.toDouble()
                          out["provider"] = best.provider ?: "unknown"
                          out["ts"] = best.time
                      } else {
                          out["ok"] = false
                          out["err"] = "no_fix"
                      }
                  } catch (_: Throwable) {
                      out["ok"] = false
                  }
                  return out
              }

              @Synchronized
              private fun loadNativeDbSynchronously(): String? {
                  try {
                      val sp = applicationContext.getSharedPreferences("mayak_native_db_v15", Context.MODE_PRIVATE)
                      val fromSp = sp.getString("master_json", null)
                      if (!fromSp.isNullOrBlank() && fromSp.length > 10) {
                          return fromSp
                      }
                  } catch (_: Throwable) {}

                  val dataDir = File(filesDir, "mayak_data")
                  for (name in listOf("mayak_store_v15.json", "mayak_store_v15.bak.json", "mayak_store_v14.json")) {
                      try {
                          val f = File(dataDir, name)
                          if (f.exists() && f.length() > 10) {
                              return f.readText(Charsets.UTF_8)
                          }
                      } catch (_: Throwable) {}
                  }
                  return null
              }

              // Извлечение мини-превью (JPEG в Base64 в памяти, БЕЗ сохранения каких-либо картинок в Загрузки!)
              private fun extractPreviewBase64Internal(path: String, isVideo: Boolean): String? {
                  if (path.isBlank() || !File(path).exists()) return null
                  return try {
                      val bmp: Bitmap? = if (isVideo) {
                          val retriever = MediaMetadataRetriever()
                          try {
                              retriever.setDataSource(path)
                              retriever.getFrameAtTime(300_000L, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                                  ?: retriever.getFrameAtTime(0L)
                          } finally {
                              try { retriever.release() } catch (_: Throwable) {}
                          }
                      } else {
                          val opts = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                          BitmapFactory.decodeFile(path, opts)
                          var sample = 1
                          while (opts.outWidth / sample > 360 || opts.outHeight / sample > 360) {
                              sample *= 2
                          }
                          BitmapFactory.decodeFile(path, BitmapFactory.Options().apply { inSampleSize = sample })
                      }
                      if (bmp == null) return null
                      val maxW = 320
                      val scale = if (bmp.width > maxW) maxW.toFloat() / bmp.width.toFloat() else 1.0f
                      val outW = (bmp.width * scale).toInt().coerceAtLeast(48)
                      val outH = (bmp.height * scale).toInt().coerceAtLeast(48)
                      val scaled = Bitmap.createScaledBitmap(bmp, outW, outH, true)
                      val baos = ByteArrayOutputStream()
                      scaled.compress(Bitmap.CompressFormat.JPEG, 68, baos)
                      Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP)
                  } catch (_: Throwable) {
                      null
                  }
              }

              private fun clearDownloadedMediaCacheInternal(): Long {
                  var freed = 0L
                  for (folderName in listOf("mayak_received")) {
                      val dir = File(filesDir, folderName)
                      if (dir.exists() && dir.isDirectory) {
                          dir.listFiles()?.forEach { f ->
                              try {
                                  if (f.isFile) {
                                      freed += f.length()
                                      f.delete()
                                  }
                              } catch (_: Throwable) {}
                          }
                      }
                  }
                  return freed
              }

              private fun initInAppVideoInternal(path: String): Map<String, Any>? {
                  return try {
                      disposeInAppVideoInternal()
                      val engine = flutterEngineRef ?: return null
                      val entry = engine.renderer.createSurfaceTexture()
                      val surface = Surface(entry.surfaceTexture())
                      val mp = MediaPlayer()
                      videoCompletedFlag = false
                      mp.setDataSource(path)
                      mp.setSurface(surface)
                      mp.prepare()
                      val w = mp.videoWidth.coerceAtLeast(320)
                      val h = mp.videoHeight.coerceAtLeast(240)
                      entry.surfaceTexture().setDefaultBufferSize(w, h)
                      mp.setOnCompletionListener {
                          videoCompletedFlag = true
                      }
                      mp.start()

                      videoTextureEntry = entry
                      videoSurface = surface
                      videoPlayer = mp

                      mapOf(
                          "textureId" to entry.id(),
                          "width" to w,
                          "height" to h,
                          "durationMs" to mp.duration.coerceAtLeast(1)
                      )
                  } catch (_: Throwable) {
                      disposeInAppVideoInternal()
                      null
                  }
              }

              private fun controlInAppVideoInternal(action: String, posMs: Int): Map<String, Any>? {
                  val mp = videoPlayer ?: return null
                  return try {
                      when (action) {
                          "play" -> {
                              if (videoCompletedFlag) {
                                  mp.seekTo(0)
                                  videoCompletedFlag = false
                              }
                              if (!mp.isPlaying) mp.start()
                          }
                          "pause" -> if (mp.isPlaying) mp.pause()
                          "seek" -> {
                              videoCompletedFlag = false
                              mp.seekTo(posMs.coerceIn(0, mp.duration.coerceAtLeast(1)))
                          }
                      }
                      mapOf(
                          "isPlaying" to mp.isPlaying,
                          "isCompleted" to videoCompletedFlag,
                          "positionMs" to mp.currentPosition,
                          "durationMs" to mp.duration.coerceAtLeast(1)
                      )
                  } catch (_: Throwable) {
                      null
                  }
              }

              private fun disposeInAppVideoInternal() {
                  videoCompletedFlag = false
                  try { videoPlayer?.stop() } catch (_: Throwable) {}
                  try { videoPlayer?.release() } catch (_: Throwable) {}
                  videoPlayer = null
                  try { videoSurface?.release() } catch (_: Throwable) {}
                  videoSurface = null
                  try { videoTextureEntry?.release() } catch (_: Throwable) {}
                  videoTextureEntry = null
              }

              private fun startVoiceRecordingInternal(): Boolean {
                  return try {
                      stopVoiceRecordingInternal()
                      val outDir = File(filesDir, "voice_notes").apply { mkdirs() }
                      val outFile = File(outDir, "voice_${System.currentTimeMillis()}.m4a")
                      val recorder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          MediaRecorder(this)
                      } else {
                          @Suppress("DEPRECATION")
                          MediaRecorder()
                      }
                      recorder.setAudioSource(MediaRecorder.AudioSource.MIC)
                      recorder.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                      recorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                      recorder.setAudioSamplingRate(16000)
                      recorder.setAudioEncodingBitRate(24000)
                      recorder.setOutputFile(outFile.absolutePath)
                      recorder.prepare()
                      recorder.start()
                      mediaRecorder = recorder
                      currentVoiceFilePath = outFile.absolutePath
                      voiceStartMs = System.currentTimeMillis()
                      true
                  } catch (t: Throwable) {
                      mediaRecorder = null
                      false
                  }
              }

              private fun stopVoiceRecordingInternal(): Map<String, Any>? {
                  val rec = mediaRecorder ?: return null
                  val path = currentVoiceFilePath
                  mediaRecorder = null
                  currentVoiceFilePath = null
                  return try {
                      rec.stop()
                      rec.release()
                      val durSec = ((System.currentTimeMillis() - voiceStartMs) / 1000L).coerceAtLeast(1L)
                      if (path != null && File(path).exists() && File(path).length() > 0) {
                          mapOf(
                              "path" to path,
                              "name" to "Голосовое_${durSec}сек.m4a",
                              "size" to File(path).length(),
                              "durationSec" to durSec
                          )
                      } else null
                  } catch (_: Throwable) {
                      try { rec.release() } catch (_: Throwable) {}
                      null
                  }
              }

              private fun playAudioInternal(path: String): Map<String, Any>? {
                  return try {
                      if (currentAudioPath == path && audioPlayer != null) {
                          val mp = audioPlayer!!
                          if (mp.isPlaying) {
                              mp.pause()
                          } else {
                              mp.start()
                          }
                          return mapOf(
                              "isPlaying" to mp.isPlaying,
                              "positionMs" to mp.currentPosition,
                              "durationMs" to mp.duration.coerceAtLeast(1)
                          )
                      }
                      stopAudioInternal()
                      val mp = MediaPlayer()
                      mp.setDataSource(path)
                      mp.prepare()
                      mp.start()
                      currentAudioPath = path
                      mp.setOnCompletionListener {
                          mainHandler.post {
                              methodChannel?.invokeMethod("onAudioCompleted", path)
                          }
                      }
                      audioPlayer = mp
                      mapOf(
                          "isPlaying" to true,
                          "positionMs" to 0,
                          "durationMs" to mp.duration.coerceAtLeast(1)
                      )
                  } catch (_: Throwable) {
                      null
                  }
              }

              private fun stopAudioInternal() {
                  try { audioPlayer?.stop() } catch (_: Throwable) {}
                  try { audioPlayer?.release() } catch (_: Throwable) {}
                  audioPlayer = null
                  currentAudioPath = null
              }

              private fun openFileWithSystemViewer(path: String): Boolean {
                  return try {
                      val file = File(path)
                      if (!file.exists()) return false
                      val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
                      val ext = file.extension.lowercase(Locale.US)
                      val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext) ?: "*/*"
                      val intent = Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, mime)
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      startActivity(Intent.createChooser(intent, "Открыть файл"))
                      true
                  } catch (_: Throwable) {
                      false
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 7004) {
                      val res = pendingFilePickResult
                      pendingFilePickResult = null
                      if (res == null) return
                      if (resultCode != Activity.RESULT_OK || data?.data == null) {
                          res.success(null)
                          return
                      }
                      try {
                          val uri = data.data!!
                          var displayName = "file_${System.currentTimeMillis()}"
                          val cursor: Cursor? = contentResolver.query(uri, null, null, null, null)
                          cursor?.use {
                              if (it.moveToFirst()) {
                                  val idx = it.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                                  if (idx >= 0) {
                                      val rawName = it.getString(idx)
                                      if (!rawName.isNullOrBlank()) {
                                          displayName = rawName
                                      }
                                  }
                              }
                          }

                          val mime = contentResolver.getType(uri) ?: ""
                          if (!displayName.contains(".")) {
                              val ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mime)
                                  ?: when {
                                      mime.contains("jpeg") || mime.contains("jpg") -> "jpg"
                                      mime.contains("png") -> "png"
                                      mime.contains("webp") -> "webp"
                                      mime.contains("gif") -> "gif"
                                      mime.contains("mp4") -> "mp4"
                                      mime.contains("mkv") -> "mkv"
                                      mime.contains("webm") -> "webm"
                                      mime.contains("quicktime") || mime.contains("mov") -> "mov"
                                      mime.contains("mpeg") || mime.contains("mp3") -> "mp3"
                                      mime.contains("m4a") || mime.contains("mp4a") -> "m4a"
                                      mime.contains("wav") -> "wav"
                                      mime.contains("ogg") -> "ogg"
                                      mime.contains("pdf") -> "pdf"
                                      else -> "bin"
                                  }
                              displayName = "$displayName.$ext"
                          }

                          val safeName = displayName.replace(Regex("[^a-zA-Z0-9._а-яА-ЯёЁ-]"), "_")
                          val outDir = File(filesDir, "picked_files").apply { mkdirs() }
                          val outFile = File(outDir, "${System.currentTimeMillis()}_$safeName")
                          contentResolver.openInputStream(uri)?.use { input ->
                              FileOutputStream(outFile).use { output ->
                                  input.copyTo(output)
                              }
                          }
                          if (!outFile.exists() || outFile.length() == 0L) {
                              res.success(null)
                              return
                          }
                          val lower = displayName.lowercase(Locale.US)
                          val isVid = lower.endsWith(".mp4") || lower.endsWith(".mkv") || lower.endsWith(".mov") || lower.endsWith(".webm") || lower.endsWith(".avi")
                          val isImg = lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".png") || lower.endsWith(".webp") || lower.endsWith(".gif")
                          var thumbB64 = ""
                          if (isVid || isImg) {
                              thumbB64 = extractPreviewBase64Internal(outFile.absolutePath, isVid) ?: ""
                          }
                          res.success(
                              mapOf(
                                  "path" to outFile.absolutePath,
                                  "name" to displayName,
                                  "size" to outFile.length(),
                                  "mime" to mime,
                                  "thumbB64" to thumbB64
                              )
                          )
                      } catch (t: Throwable) {
                          mainHandler.post {
                              methodChannel?.invokeMethod("onNativeLog", "Ошибка чтения файла: ${t.message}")
                          }
                          res.success(null)
                      }
                  }
              }

              private fun saveToPublicDownloads(srcPath: String, fileName: String): String {
                  return try {
                      val srcFile = File(srcPath)
                      if (!srcFile.exists()) return "Файл не найден"
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.Downloads.DISPLAY_NAME, fileName)
                              put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Mayak")
                          }
                          val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                          if (uri != null) {
                              contentResolver.openOutputStream(uri)?.use { out ->
                                  srcFile.inputStream().use { input -> input.copyTo(out) }
                              }
                              "Сохранено в Загрузки/Mayak/$fileName"
                          } else {
                              "Ошибка сохранения"
                          }
                      } else {
                          val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "Mayak").apply { mkdirs() }
                          val dst = File(dir, fileName)
                          srcFile.copyTo(dst, true)
                          "Сохранено: ${dst.absolutePath}"
                      }
                  } catch (t: Throwable) {
                      "Ошибка: ${t.message}"
                  }
              }

