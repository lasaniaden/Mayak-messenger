              private fun getMissingNearbyPermissions(): List<String> {
                  val required = mutableListOf(
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  )
                  if (Build.VERSION.SDK_INT >= 31) {
                      required.add(Manifest.permission.BLUETOOTH_SCAN)
                      required.add(Manifest.permission.BLUETOOTH_ADVERTISE)
                      required.add(Manifest.permission.BLUETOOTH_CONNECT)
                  }
                  if (Build.VERSION.SDK_INT >= 33) {
                      required.add(Manifest.permission.NEARBY_WIFI_DEVICES)
                  }
                  return required.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  val res = pendingPermResult
                  pendingPermResult = null
                  if (res != null) {
                      try {
                          if (requestCode == 7001) {
                              val ok = getMissingNearbyPermissions().isEmpty()
                              res.success(ok)
                              if (ok && pendingNearbyAutoStart && localNodeId.isNotEmpty()) {
                                  pendingNearbyAutoStart = false
                                  startNearbyInternalOnly()
                              }
                          } else if (requestCode == 7005) {
                              val granted = grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED
                              if (granted) {
                                  res.success(startVoiceRecordingInternal())
                              } else {
                                  res.success(false)
                              }
                          } else if (requestCode == 7006) {
                              val granted = grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED
                              if (granted) ensureLiveLocationUpdates()
                              res.success(granted)
                          } else if (requestCode == 7002 || requestCode == 7003) {
                              val granted = grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED
                              if (requestCode == 7003 && granted) {
                                  startBgServiceSafe()
                              }
                              res.success(granted)
                          } else {
                              res.success(false)
                          }
                      } catch (_: Throwable) {}
                  }
                  if (requestCode == 4202 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startCallAudioInternal()
                  } else if (requestCode == 4203 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startCallCameraInternal(callCameraFront)
                  }
              }

              private val payloadCallback = object : PayloadCallback() {
                  override fun onPayloadReceived(endpointId: String, payload: Payload) {
                      try {
                          if (payload.type == Payload.Type.BYTES) {
                              val bytes = payload.asBytes() ?: return
                              val str = String(bytes, Charsets.UTF_8)
                              mainHandler.post {
                                  methodChannel?.invokeMethod(
                                      "onNearbyPayload",
                                      mapOf("endpointId" to endpointId, "data" to str)
                                  )
                              }
                          }
                      } catch (_: Throwable) {}
                  }

                  override fun onPayloadTransferUpdate(endpointId: String, update: PayloadTransferUpdate) {}
              }

              private val connectionLifecycleCallback = object : ConnectionLifecycleCallback() {
                  override fun onConnectionInitiated(endpointId: String, info: ConnectionInfo) {
                      try {
                          Nearby.getConnectionsClient(applicationContext)
                              .acceptConnection(endpointId, payloadCallback)
                      } catch (_: Throwable) {}
                  }

                  override fun onConnectionResult(endpointId: String, resolution: ConnectionResolution) {
                      try {
                          mainHandler.post {
                              pendingBleEndpoints.remove(endpointId)
                              if (resolution.status.isSuccess) {
                                  connectedBleEndpoints.add(endpointId)
                                  methodChannel?.invokeMethod("onNativeLog", "BLE Nearby: Подключён узел $endpointId")
                                  methodChannel?.invokeMethod("onNearbyConnected", endpointId)
                              } else {
                                  connectedBleEndpoints.remove(endpointId)
                                  methodChannel?.invokeMethod("onNativeLog", "BLE Nearby: Сбой подключения к $endpointId (код ${resolution.status.statusCode})")
                                  methodChannel?.invokeMethod("onNearbyDisconnected", endpointId)
                              }
                          }
                      } catch (_: Throwable) {}
                  }

                  override fun onDisconnected(endpointId: String) {
                      try {
                          connectedBleEndpoints.remove(endpointId)
                          mainHandler.post {
                              methodChannel?.invokeMethod("onNearbyDisconnected", endpointId)
                          }
                      } catch (_: Throwable) {}
                  }
              }

              private val endpointDiscoveryCallback = object : EndpointDiscoveryCallback() {
                  override fun onEndpointFound(endpointId: String, info: DiscoveredEndpointInfo) {
                      try {
                          if (localNodeId.isNotEmpty() &&
                              localNodeId != info.endpointName &&
                              !connectedBleEndpoints.contains(endpointId) &&
                              !pendingBleEndpoints.contains(endpointId)) {
                              pendingBleEndpoints.add(endpointId)
                              mainHandler.post {
                                  methodChannel?.invokeMethod("onNativeLog", "BLE Nearby: Обнаружен узел ${info.endpointName} ($endpointId)")
                              }
                              val jitter = (Math.random() * 600).toLong()
                              val delayMs = (if (localNodeId < info.endpointName) 150L else 1900L) + jitter
                              mainHandler.postDelayed({
                                  try {
                                      if (!connectedBleEndpoints.contains(endpointId)) {
                                          Nearby.getConnectionsClient(applicationContext).requestConnection(
                                              localNodeId,
                                              endpointId,
                                              connectionLifecycleCallback
                                          ).addOnFailureListener {
                                              pendingBleEndpoints.remove(endpointId)
                                              // Retry once after 2.5s for MediaTek/Tecno/Xiaomi stacks
                                              mainHandler.postDelayed({
                                                  try {
                                                      if (!connectedBleEndpoints.contains(endpointId)) {
                                                          Nearby.getConnectionsClient(applicationContext).requestConnection(
                                                              localNodeId,
                                                              endpointId,
                                                              connectionLifecycleCallback
                                                          )
                                                      }
                                                  } catch (_: Throwable) {}
                                              }, 2500L)
                                          }
                                      } else {
                                          pendingBleEndpoints.remove(endpointId)
                                      }
                                  } catch (_: Throwable) {
                                      pendingBleEndpoints.remove(endpointId)
                                  }
                              }, delayMs)
                          }
                      } catch (_: Throwable) {}
                  }

                  override fun onEndpointLost(endpointId: String) {
                      try {
                          connectedBleEndpoints.remove(endpointId)
                          pendingBleEndpoints.remove(endpointId)
                          mainHandler.post {
                              methodChannel?.invokeMethod("onNearbyDisconnected", endpointId)
                          }
                      } catch (_: Throwable) {}
                  }
              }

              private fun startNearbyInternalOnly() {
                  startNativeBtRfcommMesh()
                  try {
                      val client = Nearby.getConnectionsClient(applicationContext)
                      client.stopAdvertising()
                      client.stopDiscovery()
                      val advOptions = AdvertisingOptions.Builder()
                          .setStrategy(Strategy.P2P_CLUSTER)
                          .setLowPower(true)
                          .build()
                      val discOptions = DiscoveryOptions.Builder()
                          .setStrategy(Strategy.P2P_CLUSTER)
                          .setLowPower(true)
                          .build()
                      mainHandler.postDelayed({
                          try {
                              client.startAdvertising(localNodeId, serviceId, connectionLifecycleCallback, advOptions)
                                  .addOnSuccessListener {
                                      mainHandler.post {
                                          methodChannel?.invokeMethod("onNativeLog", "BLE Nearby: Реклама запущена (P2P_CLUSTER)")
                                      }
                                  }
                                  .addOnFailureListener { e ->
                                      mainHandler.post {
                                          methodChannel?.invokeMethod("onNativeLog", "BLE Advertising: ${e.message}")
                                      }
                                  }
                              client.startDiscovery(serviceId, endpointDiscoveryCallback, discOptions)
                                  .addOnSuccessListener {
                                      mainHandler.post {
                                          methodChannel?.invokeMethod("onNativeLog", "BLE Nearby: Поиск устройств запущен")
                                      }
                                  }
                                  .addOnFailureListener { e ->
                                      mainHandler.post {
                                          methodChannel?.invokeMethod("onNativeLog", "BLE Discovery: ${e.message}")
                                      }
                                  }
                          } catch (_: Throwable) {}
                      }, 450L)
                  } catch (_: Throwable) {}
              }

              private fun startNearbyMesh(nodeIdArg: String, srvIdArg: String, result: MethodChannel.Result) {
                  localNodeId = nodeIdArg
                  serviceId = srvIdArg
                  val missing = getMissingNearbyPermissions()
                  if (missing.isNotEmpty()) {
                      pendingNearbyAutoStart = true
                      try {
                          ActivityCompat.requestPermissions(this, missing.toTypedArray(), 7001)
                      } catch (_: Throwable) {}
                      result.success("MISSING_PERMISSIONS")
                      return
                  }
                  if (!isLocationTurnedOn()) {
                      mainHandler.post {
                          methodChannel?.invokeMethod("onNativeLog", "ПОДСКАЗКА: Для Google Nearby включи Геолокацию (GPS). Параллельно запущен нативный Bluetooth RFCOMM (работает и без GPS)!")
                      }
                  }
                  try {
                      val btMgr = getSystemService(Context.BLUETOOTH_SERVICE) as? android.bluetooth.BluetoothManager
                      if (btMgr?.adapter?.isEnabled == false) {
                          mainHandler.post {
                              methodChannel?.invokeMethod("onNativeLog", "ВНИМАНИЕ: Bluetooth выключен! Включи Bluetooth в шторке телефона.")
                          }
                      }
                  } catch (_: Throwable) {}
                  startNearbyInternalOnly()
                  result.success("OK")
              }

              @Suppress("MissingPermission")
              private fun startNativeBtRfcommMesh() {
                  stopNativeBtRfcommMesh()
                  try {
                      val btMgr = getSystemService(Context.BLUETOOTH_SERVICE) as? android.bluetooth.BluetoothManager
                      val adapter = btMgr?.adapter ?: return
                      if (!adapter.isEnabled) return
                      btMeshRunning.set(true)

                      // 1. Входящий Bluetooth RFCOMM-сервер для уже сопряжённых устройств (без повторного PIN 0000/1234!)
                      Thread {
                          try {
                              val srv = adapter.listenUsingRfcommWithServiceRecord("MayakMesh", btRfcommUuid)
                              btServerSocket = srv
                              mainHandler.post {
                                  methodChannel?.invokeMethod("onNativeLog", "BT RFCOMM: Сервер активен (готов к приёму узлов)")
                              }
                              while (btMeshRunning.get()) {
                                  val sock = try { srv.accept() } catch (_: Throwable) { break }
                                  if (sock != null) {
                                      handleBtSocketConnected(sock)
                                  }
                              }
                          } catch (_: Throwable) {}
                      }.start()

                      // 2. Периодическое автоподключение ко всем сопряжённым Bluetooth-телефонам с Маяком
                      Thread {
                          while (btMeshRunning.get()) {
                              try {
                                  val bonded = adapter.bondedDevices
                                  if (bonded != null) {
                                      for (dev in bonded) {
                                          if (!btMeshRunning.get()) break
                                          val epId = "bt_${dev.address}"
                                          if (btSockets.containsKey(epId)) continue
                                          // Подключаемся только к телефонам/компьютерам (пропускаем наушники/часы)
                                          val majorClass = dev.bluetoothClass?.majorDeviceClass ?: 0
                                          if (majorClass != 0 &&
                                              majorClass != android.bluetooth.BluetoothClass.Device.Major.PHONE &&
                                              majorClass != android.bluetooth.BluetoothClass.Device.Major.COMPUTER &&
                                              majorClass != android.bluetooth.BluetoothClass.Device.Major.UNCATEGORIZED) {
                                              continue
                                          }
                                          if (dev.bondState != android.bluetooth.BluetoothDevice.BOND_BONDED) continue
                                          if (connectedBleEndpoints.isNotEmpty()) continue
                                          try {
                                              val s = dev.createRfcommSocketToServiceRecord(btRfcommUuid)
                                              s.connect()
                                              handleBtSocketConnected(s)
                                          } catch (_: Throwable) {}
                                      }
                                  }
                              } catch (_: Throwable) {}
                              var waited = 0
                              while (waited < 12000 && btMeshRunning.get()) {
                                  try { Thread.sleep(500) } catch (_: Throwable) { break }
                                  waited += 500
                              }
                          }
                      }.start()
                  } catch (_: Throwable) {}
              }

              @Suppress("MissingPermission")
              private fun handleBtSocketConnected(sock: android.bluetooth.BluetoothSocket) {
                  val addr = try { sock.remoteDevice?.address ?: "unknown" } catch (_: Throwable) { "unknown" }
                  val epId = "bt_$addr"
                  if (btSockets.containsKey(epId)) {
                      try { sock.close() } catch (_: Throwable) {}
                      return
                  }
                  btSockets[epId] = sock
                  mainHandler.post {
                      methodChannel?.invokeMethod("onNativeLog", "BT RFCOMM: Подключён узел $addr")
                      methodChannel?.invokeMethod("onNearbyConnected", epId)
                  }
                  Thread {
                      try {
                          val reader = java.io.BufferedReader(java.io.InputStreamReader(sock.inputStream, Charsets.UTF_8))
                          while (btMeshRunning.get()) {
                              val line = reader.readLine() ?: break
                              if (line.isNotEmpty()) {
                                  mainHandler.post {
                                      methodChannel?.invokeMethod(
                                          "onNearbyPayload",
                                          mapOf("endpointId" to epId, "data" to line)
                                      )
                                  }
                              }
                          }
                      } catch (_: Throwable) {
                      } finally {
                          btSockets.remove(epId)
                          try { sock.close() } catch (_: Throwable) {}
                          mainHandler.post {
                              methodChannel?.invokeMethod("onNearbyDisconnected", epId)
                          }
                      }
                  }.start()
              }

              private fun stopNativeBtRfcommMesh() {
                  btMeshRunning.set(false)
                  try { btServerSocket?.close() } catch (_: Throwable) {}
                  btServerSocket = null
                  for ((_, s) in btSockets) {
                      try { s.close() } catch (_: Throwable) {}
                  }
                  btSockets.clear()
              }

              private fun sendPayloadSafe(endpointId: String, data: String) {
                  if (endpointId.startsWith("bt_")) {
                      val sock = btSockets[endpointId] ?: return
                      btWriteExec.execute {
                          try {
                              val os = sock.outputStream
                              os.write(data.toByteArray(Charsets.UTF_8))
                              os.write(10)
                              os.flush()
                          } catch (_: Throwable) {
                              btSockets.remove(endpointId)
                              try { sock.close() } catch (_: Throwable) {}
                              mainHandler.post {
                                  methodChannel?.invokeMethod("onNearbyDisconnected", endpointId)
                              }
                          }
                      }
                      return
                  }
                  try {
                      val bytes = data.toByteArray(Charsets.UTF_8)
                      Nearby.getConnectionsClient(applicationContext)
                          .sendPayload(endpointId, Payload.fromBytes(bytes))
                  } catch (_: Throwable) {}
              }

              private fun stopNearbySafe() {
                  stopNativeBtRfcommMesh()
                  try {
                      connectedBleEndpoints.clear()
                      pendingBleEndpoints.clear()
                      val client = Nearby.getConnectionsClient(applicationContext)
                      client.stopAdvertising()
                      client.stopDiscovery()
                      client.stopAllEndpoints()
                  } catch (_: Throwable) {}
              }

              // ==================== v1.8.0 FULL-DUPLEX CALL ENGINE ====================
              private fun startCallAudioInternal(): Boolean {
                  stopCallAudioInternal()
                  return try {
                      val sampleRate = 16000
                      val chunkBytes = 1280 // 40ms @ 16kHz 16-bit mono PCM
                      val minRec = android.media.AudioRecord.getMinBufferSize(
                          sampleRate,
                          android.media.AudioFormat.CHANNEL_IN_MONO,
                          android.media.AudioFormat.ENCODING_PCM_16BIT
                      ).coerceAtLeast(chunkBytes * 4)

                      val minPlay = android.media.AudioTrack.getMinBufferSize(
                          sampleRate,
                          android.media.AudioFormat.CHANNEL_OUT_MONO,
                          android.media.AudioFormat.ENCODING_PCM_16BIT
                      ).coerceAtLeast(chunkBytes * 4)

                      setCallSpeakerInternal(callSpeakerEnabled.get())

                      val rec = android.media.AudioRecord(
                          android.media.MediaRecorder.AudioSource.VOICE_COMMUNICATION,
                          sampleRate,
                          android.media.AudioFormat.CHANNEL_IN_MONO,
                          android.media.AudioFormat.ENCODING_PCM_16BIT,
                          minRec
                      )
                      if (rec.state != android.media.AudioRecord.STATE_INITIALIZED) {
                          rec.release()
                          return false
                      }
                      callAudioRecord = rec

                      try {
                          if (android.media.audiofx.AcousticEchoCanceler.isAvailable()) {
                              callAec = android.media.audiofx.AcousticEchoCanceler.create(rec.audioSessionId)?.apply {
                                  enabled = true
                              }
                          }
                      } catch (_: Throwable) {}
                      try {
                          if (android.media.audiofx.NoiseSuppressor.isAvailable()) {
                              callNs = android.media.audiofx.NoiseSuppressor.create(rec.audioSessionId)?.apply {
                                  enabled = true
                              }
                          }
                      } catch (_: Throwable) {}

                      val track = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          android.media.AudioTrack.Builder()
                              .setAudioAttributes(
                                  android.media.AudioAttributes.Builder()
                                      .setUsage(android.media.AudioAttributes.USAGE_VOICE_COMMUNICATION)
                                      .setContentType(android.media.AudioAttributes.CONTENT_TYPE_SPEECH)
                                      .build()
                              )
                              .setAudioFormat(
                                  android.media.AudioFormat.Builder()
                                      .setEncoding(android.media.AudioFormat.ENCODING_PCM_16BIT)
                                      .setSampleRate(sampleRate)
                                      .setChannelMask(android.media.AudioFormat.CHANNEL_OUT_MONO)
                                      .build()
                              )
                              .setBufferSizeInBytes(minPlay)
                              .setTransferMode(android.media.AudioTrack.MODE_STREAM)
                              .build()
                      } else {
                          @Suppress("DEPRECATION")
                          android.media.AudioTrack(
                              android.media.AudioManager.STREAM_VOICE_CALL,
                              sampleRate,
                              android.media.AudioFormat.CHANNEL_OUT_MONO,
                              android.media.AudioFormat.ENCODING_PCM_16BIT,
                              minPlay,
                              android.media.AudioTrack.MODE_STREAM
                          )
                      }
                      callAudioTrack = track
                      callPlayQueue.clear()
                      callAudioMuted.set(false)
                      callAudioRunning.set(true)

                      rec.startRecording()
                      track.play()

                      // Capture thread
                      Thread {
                          android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_URGENT_AUDIO)
                          val buf = ByteArray(chunkBytes)
                          while (callAudioRunning.get()) {
                              try {
                                  val read = rec.read(buf, 0, chunkBytes)
                                  if (read > 0 && !callAudioMuted.get()) {
                                      val copy = buf.copyOf(read)
                                      mainHandler.post {
                                          if (callAudioRunning.get()) {
                                              methodChannel?.invokeMethod("onCallAudioPcm", copy)
                                          }
                                      }
                                  }
                              } catch (_: Throwable) {
                                  break
                              }
                          }
                      }.start()

                      // Playback thread
                      Thread {
                          android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_URGENT_AUDIO)
                          while (callAudioRunning.get()) {
                              try {
                                  val pkt = callPlayQueue.poll(120, java.util.concurrent.TimeUnit.MILLISECONDS)
                                  if (pkt != null && callAudioRunning.get()) {
                                      if (callSpeakerEnabled.get()) {
                                          val boosted = ByteArray(pkt.size)
                                          var i = 0
                                          while (i + 1 < pkt.size) {
                                              val lo = pkt[i].toInt() and 0xFF
                                              val hi = pkt[i + 1].toInt()
                                              val sample = (hi shl 8) or lo
                                              val scaled = sample.coerceIn(-32767, 32767)
                                              boosted[i] = (scaled and 0xFF).toByte()
                                              boosted[i + 1] = ((scaled shr 8) and 0xFF).toByte()
                                              i += 2
                                          }
                                          track.write(boosted, 0, boosted.size)
                                      } else {
                                          track.write(pkt, 0, pkt.size)
                                      }
                                  }
                              } catch (_: Throwable) {
                                  break
                              }
                          }
                      }.start()

                      true
                  } catch (t: Throwable) {
                      stopCallAudioInternal()
                      false
                  }
              }

              private fun stopCallAudioInternal() {
                  callAudioRunning.set(false)
                  callPlayQueue.clear()
                  try { callAec?.release() } catch (_: Throwable) {}
                  callAec = null
                  try { callNs?.release() } catch (_: Throwable) {}
                  callNs = null
                  try { callAudioRecord?.stop() } catch (_: Throwable) {}
                  try { callAudioRecord?.release() } catch (_: Throwable) {}
                  callAudioRecord = null
                  try { callAudioTrack?.pause() } catch (_: Throwable) {}
                  try { callAudioTrack?.flush() } catch (_: Throwable) {}
                  try { callAudioTrack?.stop() } catch (_: Throwable) {}
                  try { callAudioTrack?.release() } catch (_: Throwable) {}
                  callAudioTrack = null
                  try {
                      val am = getSystemService(Context.AUDIO_SERVICE) as android.media.AudioManager
                      if (Build.VERSION.SDK_INT >= 31) {
                          am.clearCommunicationDevice()
                      }
                      @Suppress("DEPRECATION")
                      am.isSpeakerphoneOn = false
                      am.mode = android.media.AudioManager.MODE_NORMAL
                  } catch (_: Throwable) {}
              }

              private fun setCallSpeakerInternal(enabled: Boolean) {
                  callSpeakerEnabled.set(enabled)
                  try {
                      val am = getSystemService(Context.AUDIO_SERVICE) as android.media.AudioManager
                      am.mode = android.media.AudioManager.MODE_IN_COMMUNICATION
                      if (Build.VERSION.SDK_INT >= 31) {
                          val wantedType = if (enabled) {
                              android.media.AudioDeviceInfo.TYPE_BUILTIN_SPEAKER
                          } else {
                              android.media.AudioDeviceInfo.TYPE_BUILTIN_EARPIECE
                          }
                          val dev = am.availableCommunicationDevices.firstOrNull { it.type == wantedType }
                          if (dev != null) {
                              am.setCommunicationDevice(dev)
                          }
                      }
                      @Suppress("DEPRECATION")
                      am.isSpeakerphoneOn = enabled
                  } catch (_: Throwable) {}
              }

              private fun rotateNv21(src: ByteArray, w: Int, h: Int, deg: Int): Triple<ByteArray, Int, Int> {
                  if (deg == 0) return Triple(src, w, h)
                  val frameSize = w * h
                  val out = ByteArray(src.size)
                  if (deg == 90) {
                      var idx = 0
                      for (x in 0 until w) {
                          for (y in h - 1 downTo 0) {
                              out[idx++] = src[y * w + x]
                          }
                      }
                      idx = frameSize
                      var x = 0
                      while (x < w) {
                          for (y in (h / 2) - 1 downTo 0) {
                              val uvPos = frameSize + y * w + x
                              out[idx++] = src[uvPos]
                              out[idx++] = src[uvPos + 1]
                          }
                          x += 2
                      }
                      return Triple(out, h, w)
                  } else if (deg == 270) {
                      var idx = 0
                      for (x in w - 1 downTo 0) {
                          for (y in 0 until h) {
                              out[idx++] = src[y * w + x]
                          }
                      }
                      idx = frameSize
                      var x = w - 2
                      while (x >= 0) {
                          for (y in 0 until h / 2) {
                              val uvPos = frameSize + y * w + x
                              out[idx++] = src[uvPos]
                              out[idx++] = src[uvPos + 1]
                          }
                          x -= 2
                      }
                      return Triple(out, h, w)
                  } else if (deg == 180) {
                      var idx = 0
                      for (i in frameSize - 1 downTo 0) {
                          out[idx++] = src[i]
                      }
                      idx = frameSize
                      var i = src.size - 2
                      while (i >= frameSize) {
                          out[idx++] = src[i]
                          out[idx++] = src[i + 1]
                          i -= 2
                      }
                      return Triple(out, w, h)
                  }
                  return Triple(src, w, h)
              }

              @Suppress("DEPRECATION")
              private fun startCallCameraInternal(front: Boolean): Boolean {
                  stopCallCameraInternal()
                  return try {
                      val camCount = android.hardware.Camera.getNumberOfCameras()
                      if (camCount <= 0) return false
                      val info = android.hardware.Camera.CameraInfo()
                      var targetId = 0
                      val wantedFacing = if (front) {
                          android.hardware.Camera.CameraInfo.CAMERA_FACING_FRONT
                      } else {
                          android.hardware.Camera.CameraInfo.CAMERA_FACING_BACK
                      }
                      for (cid in 0 until camCount) {
                          android.hardware.Camera.getCameraInfo(cid, info)
                          if (info.facing == wantedFacing) {
                              targetId = cid
                              break
                          }
                      }
                      android.hardware.Camera.getCameraInfo(targetId, info)
                      callCameraOrientation = info.orientation

                      val cam = android.hardware.Camera.open(targetId)
                      callCamera = cam
                      val params = cam.parameters
                      params.previewFormat = android.graphics.ImageFormat.NV21
                      var bestW = 320
                      var bestH = 240
                      var bestDiff = Int.MAX_VALUE
                      val sizes = params.supportedPreviewSizes
                      if (sizes != null && sizes.isNotEmpty()) {
                          bestW = sizes[0].width
                          bestH = sizes[0].height
                          for (sz in sizes) {
                              if (sz.width <= 480 && sz.height <= 480) {
                                  val diff = Math.abs(sz.width - 352) + Math.abs(sz.height - 288)
                                  if (diff < bestDiff) {
                                      bestDiff = diff
                                      bestW = sz.width
                                      bestH = sz.height
                                  }
                              }
                          }
                      }
                      try { params.setPreviewSize(bestW, bestH) } catch (_: Throwable) {}
                      try { cam.parameters = params } catch (_: Throwable) {}

                      val actualSize = cam.parameters.previewSize
                      val pw = actualSize.width
                      val ph = actualSize.height
                      val bufSize = pw * ph * 3 / 2

                      val st = android.graphics.SurfaceTexture(42)
                      callCameraSurface = st
                      cam.setPreviewTexture(st)
                      cam.addCallbackBuffer(ByteArray(bufSize))
                      cam.addCallbackBuffer(ByteArray(bufSize))

                      callCameraRunning.set(true)
                      callCameraEncoding.set(false)
                      lastCallFrameMs = 0L

                      cam.setPreviewCallbackWithBuffer { data, c ->
                          if (!callCameraRunning.get() || data == null) return@setPreviewCallbackWithBuffer
                          val now = System.currentTimeMillis()
                          if (now - lastCallFrameMs >= 55L && callCameraEncoding.compareAndSet(false, true)) {
                              lastCallFrameMs = now
                              val frameCopy = data.copyOf()
                              try { c.addCallbackBuffer(data) } catch (_: Throwable) {}
                              Thread {
                                  try {
                                      val (rotBytes, rw, rh) = rotateNv21(frameCopy, pw, ph, callCameraOrientation)
                                      val yuv = android.graphics.YuvImage(rotBytes, android.graphics.ImageFormat.NV21, rw, rh, null)
                                      val baos = java.io.ByteArrayOutputStream()
                                      yuv.compressToJpeg(android.graphics.Rect(0, 0, rw, rh), 62, baos)
                                      val jpg = baos.toByteArray()
                                      mainHandler.post {
                                          if (callCameraRunning.get()) {
                                              methodChannel?.invokeMethod("onCallVideoFrame", jpg)
                                          }
                                      }
                                  } catch (_: Throwable) {
                                  } finally {
                                      callCameraEncoding.set(false)
                                  }
                              }.start()
                          } else {
                              try { c.addCallbackBuffer(data) } catch (_: Throwable) {}
                          }
                      }
                      cam.startPreview()
                      true
                  } catch (_: Throwable) {
                      stopCallCameraInternal()
                      false
                  }
              }

              @Suppress("DEPRECATION")
              private fun stopCallCameraInternal() {
                  callCameraRunning.set(false)
                  try { callCamera?.setPreviewCallbackWithBuffer(null) } catch (_: Throwable) {}
                  try { callCamera?.stopPreview() } catch (_: Throwable) {}
                  try { callCamera?.release() } catch (_: Throwable) {}
                  callCamera = null
                  try { callCameraSurface?.release() } catch (_: Throwable) {}
                  callCameraSurface = null
              }

              private fun startIncomingRingtoneInternal() {
                  stopIncomingRingtoneInternal()
                  try {
                      val uri = android.media.RingtoneManager.getDefaultUri(android.media.RingtoneManager.TYPE_RINGTONE)
                          ?: android.media.RingtoneManager.getDefaultUri(android.media.RingtoneManager.TYPE_NOTIFICATION)
                      val r = android.media.RingtoneManager.getRingtone(applicationContext, uri)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          r?.audioAttributes = android.media.AudioAttributes.Builder()
                              .setUsage(android.media.AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                              .setContentType(android.media.AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build()
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          r?.isLooping = true
                      }
                      r?.play()
                      incomingRingtone = r
                  } catch (_: Throwable) {}
                  try {
                      @Suppress("DEPRECATION")
                      val vib = getSystemService(Context.VIBRATOR_SERVICE) as? android.os.Vibrator
                      val pattern = longArrayOf(0, 700, 500)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vib?.vibrate(android.os.VibrationEffect.createWaveform(pattern, 0))
                      } else {
                          @Suppress("DEPRECATION")
                          vib?.vibrate(pattern, 0)
                      }
                  } catch (_: Throwable) {}
              }

              private fun stopIncomingRingtoneInternal() {
                  try { incomingRingtone?.stop() } catch (_: Throwable) {}
                  incomingRingtone = null
                  try {
                      @Suppress("DEPRECATION")
                      val vib = getSystemService(Context.VIBRATOR_SERVICE) as? android.os.Vibrator
                      vib?.cancel()
                  } catch (_: Throwable) {}
              }

              private fun startOutgoingRingbackInternal() {
                  stopOutgoingRingbackInternal()
                  ringbackRunning.set(true)
                  Thread {
                      try {
                          val tg = android.media.ToneGenerator(android.media.AudioManager.STREAM_VOICE_CALL, 80)
                          ringbackToneGen = tg
                          while (ringbackRunning.get()) {
                              tg.startTone(android.media.ToneGenerator.TONE_SUP_RINGTONE, 1000)
                              var waited = 0
                              while (waited < 3200 && ringbackRunning.get()) {
                                  Thread.sleep(100)
                                  waited += 100
                              }
                          }
                      } catch (_: Throwable) {}
                  }.start()
              }

              private fun stopOutgoingRingbackInternal() {
                  ringbackRunning.set(false)
                  try { ringbackToneGen?.stopTone() } catch (_: Throwable) {}
                  try { ringbackToneGen?.release() } catch (_: Throwable) {}
                  ringbackToneGen = null
              }

              private fun playCallEndToneInternal() {
                  Thread {
                      try {
                          val tg = android.media.ToneGenerator(android.media.AudioManager.STREAM_VOICE_CALL, 75)
                          tg.startTone(android.media.ToneGenerator.TONE_PROP_PROMPT, 260)
                          Thread.sleep(320)
                          tg.release()
                      } catch (_: Throwable) {}
                  }.start()
              }

              private fun playPttSoundInternal(isStart: Boolean) {
                  Thread {
                      try {
                          val sr = 16000
                          val durMs = if (isStart) 110 else 150
                          val samples = sr * durMs / 1000
                          val pcm = ByteArray(samples * 2)
                          val f1 = if (isStart) 1150.0 else 1750.0
                          val f2 = if (isStart) 1600.0 else 1250.0
                          for (i in 0 until samples) {
                              val t = i.toDouble() / sr
                              val freq = if (i < samples / 2) f1 else f2
                              val env = if (i < 80) i / 80.0 else if (i > samples - 80) (samples - i) / 80.0 else 1.0
                              val v = (Math.sin(2.0 * Math.PI * freq * t) * 0.35 * env * 32767.0).toInt().coerceIn(-32767, 32767)
                              pcm[i * 2] = (v and 0xFF).toByte()
                              pcm[i * 2 + 1] = ((v shr 8) and 0xFF).toByte()
                          }
                          val minBuf = android.media.AudioTrack.getMinBufferSize(
                              sr,
                              android.media.AudioFormat.CHANNEL_OUT_MONO,
                              android.media.AudioFormat.ENCODING_PCM_16BIT
                          ).coerceAtLeast(pcm.size)
                          val at = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              android.media.AudioTrack.Builder()
                                  .setAudioAttributes(
                                      android.media.AudioAttributes.Builder()
                                          .setUsage(android.media.AudioAttributes.USAGE_MEDIA)
                                          .setContentType(android.media.AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                          .build()
                                  )
                                  .setAudioFormat(
                                      android.media.AudioFormat.Builder()
                                          .setEncoding(android.media.AudioFormat.ENCODING_PCM_16BIT)
                                          .setSampleRate(sr)
                                          .setChannelMask(android.media.AudioFormat.CHANNEL_OUT_MONO)
                                          .build()
                                  )
                                  .setBufferSizeInBytes(minBuf)
                                  .setTransferMode(android.media.AudioTrack.MODE_STATIC)
                                  .build()
                          } else {
                              @Suppress("DEPRECATION")
                              android.media.AudioTrack(
                                  android.media.AudioManager.STREAM_MUSIC,
                                  sr,
                                  android.media.AudioFormat.CHANNEL_OUT_MONO,
                                  android.media.AudioFormat.ENCODING_PCM_16BIT,
                                  minBuf,
                                  android.media.AudioTrack.MODE_STATIC
                              )
                          }
                          at.write(pcm, 0, pcm.size)
                          at.play()
                          Thread.sleep((durMs + 60).toLong())
                          at.release()
                      } catch (_: Throwable) {}
                  }.start()
              }

              private fun showIncomingCallFullScreenInternal(caller: String, mode: String) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                          runOnUiThread {
                              try {
                                  setShowWhenLocked(true)
                                  setTurnScreenOn(true)
                              } catch (_: Throwable) {}
                          }
                      }
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as android.app.NotificationManager
                      val callChannelId = "mayak_calls_high_v1"
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val ch = android.app.NotificationChannel(
                              callChannelId,
                              "Входящие звонки Маяк",
                              android.app.NotificationManager.IMPORTANCE_HIGH
                          ).apply {
                              lockscreenVisibility = android.app.Notification.VISIBILITY_PUBLIC
                              setBypassDnd(true)
                              enableVibration(true)
                          }
                          nm.createNotificationChannel(ch)
                      }
                      // Wake screen when locked
                      try {
                          val pm = getSystemService(Context.POWER_SERVICE) as android.os.PowerManager
                          @Suppress("DEPRECATION")
                          val wl = pm.newWakeLock(
                              android.os.PowerManager.SCREEN_BRIGHT_WAKE_LOCK or
                                  android.os.PowerManager.ACQUIRE_CAUSES_WAKEUP or
                                  android.os.PowerManager.ON_AFTER_RELEASE,
                              "mayak:incoming_call_wake"
                          )
                          wl.acquire(10000L)
                      } catch (_: Throwable) {}

                      val launchIntent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or
                              Intent.FLAG_ACTIVITY_SINGLE_TOP or
                              Intent.FLAG_ACTIVITY_REORDER_TO_FRONT
                          putExtra("mayak_incoming_call", true)
                      }
                      val piFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          android.app.PendingIntent.FLAG_UPDATE_CURRENT or android.app.PendingIntent.FLAG_IMMUTABLE
                      } else {
                          android.app.PendingIntent.FLAG_UPDATE_CURRENT
                      }
                      val fullPi = android.app.PendingIntent.getActivity(this, 9901, launchIntent, piFlags)
                      val title = if (mode == "video") "📹 Входящий видеозвонок" else "📞 Входящий звонок"
                      val notif = NotificationCompat.Builder(this, callChannelId)
                          .setSmallIcon(android.R.drawable.sym_call_incoming)
                          .setContentTitle(title)
                          .setContentText("Звонит $caller — нажмите, чтобы ответить")
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setCategory(NotificationCompat.CATEGORY_CALL)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setOngoing(true)
                          .setAutoCancel(true)
                          .setFullScreenIntent(fullPi, true)
                          .setContentIntent(fullPi)
                          .build()
                      nm.notify(9901, notif)
                      if (!isAppInForeground) {
                          try { startActivity(launchIntent) } catch (_: Throwable) {}
                      }
                  } catch (_: Throwable) {}
              }

              private fun cancelIncomingCallNotificationInternal() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                          runOnUiThread {
                              try {
                                  setShowWhenLocked(false)
                                  setTurnScreenOn(false)
                              } catch (_: Throwable) {}
                          }
                      }
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as android.app.NotificationManager
                      nm.cancel(9901)
                  } catch (_: Throwable) {}
              }

              private fun bindProcessToWifiForLanInternal(): Boolean {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return false
                  return try {
                      val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as android.net.ConnectivityManager
                      @Suppress("DEPRECATION")
                      val nets = cm.allNetworks
                      var wifiNet: android.net.Network? = null
                      var anyVpnActive = false
                      for (n in nets) {
                          val caps = cm.getNetworkCapabilities(n) ?: continue
                          if (caps.hasTransport(android.net.NetworkCapabilities.TRANSPORT_VPN)) {
                              anyVpnActive = true
                          } else if (caps.hasTransport(android.net.NetworkCapabilities.TRANSPORT_WIFI)) {
                              wifiNet = n
                          }
                      }
                      if (anyVpnActive && wifiNet != null) {
                          val ok = cm.bindProcessToNetwork(wifiNet)
                          if (ok) {
                              mainHandler.post {
                                  methodChannel?.invokeMethod("onNativeLog", "LAN Bypass: процесс привязан напрямую к физическому Wi-Fi в обход VPN/Proxy")
                              }
                          }
                          ok
                      } else {
                          cm.bindProcessToNetwork(null)
                          false
                      }
                  } catch (_: Throwable) {
                      false
                  }
              }

              override fun onDestroy() {
                  if (currentInstance == this) currentInstance = null
                  stopCallAudioInternal()
                  stopCallCameraInternal()
                  stopIncomingRingtoneInternal()
                  stopOutgoingRingbackInternal()
                  stopAudioInternal()
                  disposeInAppVideoInternal()
                  try {
                      multicastLock?.release()
                  } catch (_: Throwable) {}
                  super.onDestroy()
              }
          }
          """)
          '

      - name: Install Monochrome App Icon (Android)
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            if [ -f "assets/icons/ic_launcher_$d.png" ]; then
              cp "assets/icons/ic_launcher_$d.png" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
              cp "assets/icons/ic_launcher_$d.png" "android/app/src/main/res/mipmap-$d/ic_launcher_round.png"
            fi
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Build Obfuscated Release APK
        run: flutter build apk --release --build-name=2.9.0 --build-number=$((2900 + ${GITHUB_RUN_NUMBER:-1})) --obfuscate --split-debug-info=build/symbols

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2p-mesh-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Flutter 3.27.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Create Windows platform folder
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=p2p_mesh .

      - name: Install Monochrome App Icon (Windows)
        run: |
          if (Test-Path "assets\app_icon.ico") {
            Copy-Item "assets\app_icon.ico" "windows\runner\resources\app_icon.ico" -Force
          }

      - name: Inject Windows System Tray (Minimize to Tray on Close + Context Menu)
        run: python scripts/patch_win_tray.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build Obfuscated Windows Release
        run: flutter build windows --release --obfuscate --split-debug-info=build/symbols

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: p2p-mesh-windows-pc
          path: build/windows/x64/runner/Release/
