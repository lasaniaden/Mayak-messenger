name: Build Android APK & Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.27.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Recreate Clean Android Platform & Inject Fixed Keystore + Native Bridge v2.7.0

        run: |
          rm -rf android
          flutter create --platforms=android --org com.mayak.mesh --project-name=p2p_mesh .
          python3 scripts/patch_android.py

      - name: Install Monochrome App Icon (Android)
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            if [ -f "assets/icons/ic_launcher_$d.png" ]; then
              cp "assets/icons/ic_launcher_$d.png" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
              cp "assets/icons/ic_launcher_$d.png" "android/app/src/main/res/mipmap-$d/ic_launcher_round.png"
            fi
          done

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            gradle-v1-${{ runner.os }}-

      - name: Configure Google Maven Central Mirror (Avoid 429 Rate Limits)
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'GRADLE_EOF' > ~/.gradle/init.d/maven-mirror.gradle
          def mirrorUrl = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def rewriteRepos = { repos ->
              if (repos != null) {
                  repos.all { repo ->
                      if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
                          def u = repo.url.toString()
                          if (u.startsWith('https://repo.maven.apache.org/maven2') || u.startsWith('https://repo1.maven.org/maven2')) {
                              repo.setUrl(mirrorUrl)
                          }
                      }
                  }
              }
          }
          gradle.settingsEvaluated { settings ->
              rewriteRepos(settings.pluginManagement.repositories)
              rewriteRepos(settings.dependencyResolutionManagement.repositories)
          }
          allprojects {
              rewriteRepos(buildscript.repositories)
              rewriteRepos(repositories)
          }
          GRADLE_EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis & Unit tests
        run: |
          rm -f test/widget_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test test/mesh_core_test.dart

      - name: Build Release APK
        run: flutter build apk --release --build-name=3.2.8 --build-number=$((3280 + ${GITHUB_RUN_NUMBER:-1}))

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2p-mesh-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Flutter 3.27.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Create Windows platform folder
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=p2p_mesh .

      - name: Install Monochrome App Icon (Windows)
        run: |
          if (Test-Path "assets\app_icon.ico") {
            Copy-Item "assets\app_icon.ico" "windows\runner\resources\app_icon.ico" -Force
          }

      - name: Inject Windows System Tray (Minimize to Tray on Close + Context Menu)
        run: python scripts/patch_win_tray.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build Obfuscated Windows Release
        run: flutter build windows --release --obfuscate --split-debug-info=build/symbols

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: p2p-mesh-windows-pc
          path: build/windows/x64/runner/Release/

  publish-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: p2p-mesh-android-apk
          path: release_assets/android

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: p2p-mesh-windows-pc
          path: release_assets/windows

      - name: Package & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          TAG="v${VER}"
          mkdir -p release_out
          cp release_assets/android/app-release.apk "release_out/mayak-android-${TAG}.apk"
          (cd release_assets/windows && zip -r "../../release_out/mayak-windows-${TAG}.zip" .)
          NOTES_ARG="--generate-notes"
          if [ -f "RELEASE_NOTES.md" ]; then
            NOTES_ARG="--notes-file RELEASE_NOTES.md"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "Маяк ${TAG}" ${NOTES_ARG}
          else
            gh release create "${TAG}" --title "Маяк ${TAG}" ${NOTES_ARG}
          fi
          gh release upload "${TAG}" "release_out/mayak-android-${TAG}.apk" "release_out/mayak-windows-${TAG}.zip" --clobber
