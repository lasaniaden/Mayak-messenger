name: Build Android APK & Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.27.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Recreate Clean Android Platform & Inject Fixed Keystore + Native Bridge v1.3.0
        run: |
          rm -rf android
          flutter create --platforms=android --org com.mayak.mesh --project-name=p2p_mesh .
          python3 -c '
          import base64, glob, os, re

          # 0. Восстанавливаем постоянный ключ подписи mayak_release.jks для бесшовного обновления APK поверх старых версий
          ks_b64 = ""
          os.makedirs("android/app", exist_ok=True); kf = open("android/app/mayak_release.jks", "wb") as kf:
              kf.write(base64.b64decode(ks_b64))

          # 1. Настраиваем gradle.properties
          gp_path = "android/gradle.properties"
          gp_content = ""
          if os.path.exists(gp_path):
              with open(gp_path, "r") as f:
                  gp_content = f.read()
          if "android.enableR8.fullMode" not in gp_content:
              gp_content += "\nandroid.enableR8.fullMode=false\n"
          with open(gp_path, "w") as f:
              f.write(gp_content)

          # 2. Обновляем settings.gradle / settings.gradle.kts (AGP 8.7.0, Kotlin 2.1.0)
          for s in ["android/settings.gradle", "android/settings.gradle.kts"]:
              if os.path.exists(s):
                  with open(s, "r") as f:
                      sc = f.read()
                  sc = re.sub(
                      r"(id\s*[\(\"\x27]+com\.android\.application[\)\"\x27]+\s+version\s+[\"\x27])[^\"\x27]+([\"\x27])",
                      r"\g<1>8.7.0\g<2>",
                      sc
                  )
                  sc = re.sub(
                      r"(id\s*[\(\"\x27]+org\.jetbrains\.kotlin\.android[\)\"\x27]+\s+version\s+[\"\x27])[^\"\x27]+([\"\x27])",
                      r"\g<1>2.1.0\g<2>",
                      sc
                  )
                  with open(s, "w") as f:
                      f.write(sc)

          # 3. Обновляем Gradle Wrapper до 8.9
          gw = "android/gradle/wrapper/gradle-wrapper.properties"
          if os.path.exists(gw):
              with open(gw, "r") as f:
                  gwc = f.read()
              gwc = re.sub(
                  r"distributionUrl=.*gradle-[0-9.]+-all\.zip",
                  "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip",
                  gwc
              )
              with open(gw, "w") as f:
                  f.write(gwc)

          # 4. Переписываем android/app/build.gradle(.kts) с фиксированной подписью mayak_release.jks
          kts_path = "android/app/build.gradle.kts"
          groovy_path = "android/app/build.gradle"

          if os.path.exists(kts_path):
              with open(kts_path, "w") as f:
                  f.write("""plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.mayak.mesh.p2p_mesh"
              compileSdk = 36

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              signingConfigs {
                  create("mayakFixed") {
                      storeFile = file("mayak_release.jks")
                      storePassword = "mayak2026"
                      keyAlias = "mayak_key"
                      keyPassword = "mayak2026"
                  }
              }

              defaultConfig {
                  applicationId = "com.mayak.mesh.p2p_mesh"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 13
                  versionName = "1.3.0"
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("mayakFixed")
                  }
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("mayakFixed")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              implementation("com.google.android.gms:play-services-nearby:19.3.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          """)
          elif os.path.exists(groovy_path):
              with open(groovy_path, "w") as f:
                  f.write("""plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.mayak.mesh.p2p_mesh"
              compileSdk 36

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              signingConfigs {
                  mayakFixed {
                      storeFile file("mayak_release.jks")
                      storePassword "mayak2026"
                      keyAlias "mayak_key"
                      keyPassword "mayak2026"
                  }
              }

              defaultConfig {
                  applicationId "com.mayak.mesh.p2p_mesh"
                  minSdkVersion 23
                  targetSdkVersion 34
                  versionCode 13
                  versionName "1.3.0"
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.mayakFixed
                  }
                  release {
                      signingConfig signingConfigs.mayakFixed
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source "../.."
          }

          dependencies {
              implementation "com.google.android.gms:play-services-nearby:19.3.0"
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
          }
          """)

          # 5. Записываем AndroidManifest.xml
          res_xml_dir = "android/app/src/main/res/xml"
          os.makedirs(res_xml_dir, exist_ok=True)
          with open(os.path.join(res_xml_dir, "file_paths.xml"), "w") as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
              <external-path name="external" path="." />
          </paths>
          """)

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "w") as f:
              f.write("""<manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false"/>
              <uses-feature android:name="android.hardware.bluetooth" android:required="false"/>
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false"/>
              <uses-feature android:name="android.hardware.wifi" android:required="false"/>
              <uses-feature android:name="android.hardware.microphone" android:required="false"/>

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>

              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:label="Маяк P2P"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:enableOnBackInvokedCallback="true">

                  <meta-data
                      android:name="io.flutter.embedding.android.EnableImpeller"
                      android:value="false" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <service
                      android:name=".MayakBackgroundService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          """)

          # 6. Записываем MainActivity.kt
          kt_files = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          kt_path = kt_files[0] if kt_files else "android/app/src/main/kotlin/com/mayak/mesh/p2p_mesh/MainActivity.kt"
          os.makedirs(os.path.dirname(kt_path), exist_ok=True)
          with open(kt_path, "w") as f:
              f.write("""package com.mayak.mesh.p2p_mesh

          import android.Manifest
          import android.app.Activity
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.database.Cursor
          import android.location.LocationManager
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.MediaRecorder
          import android.media.RingtoneManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import android.provider.Settings
          import android.view.Surface
          import android.webkit.MimeTypeMap
          import androidx.core.app.ActivityCompat
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import androidx.core.content.FileProvider
          import com.google.android.gms.nearby.Nearby
          import com.google.android.gms.nearby.connection.AdvertisingOptions
          import com.google.android.gms.nearby.connection.ConnectionInfo
          import com.google.android.gms.nearby.connection.ConnectionLifecycleCallback
          import com.google.android.gms.nearby.connection.ConnectionResolution
          import com.google.android.gms.nearby.connection.DiscoveredEndpointInfo
          import com.google.android.gms.nearby.connection.DiscoveryOptions
          import com.google.android.gms.nearby.connection.EndpointDiscoveryCallback
          import com.google.android.gms.nearby.connection.Payload
          import com.google.android.gms.nearby.connection.PayloadCallback
          import com.google.android.gms.nearby.connection.PayloadTransferUpdate
          import com.google.android.gms.nearby.connection.Strategy
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import io.flutter.view.TextureRegistry
          import java.io.File
          import java.io.FileOutputStream
          import java.util.Locale
          import kotlin.system.exitProcess

          class MayakBackgroundService : Service() {
              companion object {
                  const val ACTION_STOP_SERVICE = "com.mayak.mesh.STOP_SERVICE"
                  var instance: MayakBackgroundService? = null
              }

              private var wakeLock: PowerManager.WakeLock? = null
              private var wifiLock: WifiManager.WifiLock? = null

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val chan = NotificationChannel(
                              "mayak_bg_service",
                              "Фоновое дежурство Маяк P2P",
                              NotificationManager.IMPORTANCE_LOW
                          ).apply {
                              description = "Поддерживает работу узла связи при выключенном экране"
                              setShowBadge(false)
                          }
                          val nm = getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                          nm?.createNotificationChannel(chan)
                      }

                      val openIntent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      val pFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                      val pendingOpen = PendingIntent.getActivity(this, 0, openIntent, pFlags)

                      val stopIntent = Intent(this, MayakBackgroundService::class.java).apply {
                          action = ACTION_STOP_SERVICE
                      }
                      val pendingStop = PendingIntent.getService(this, 1, stopIntent, pFlags)

                      val notif = NotificationCompat.Builder(this, "mayak_bg_service")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle("Маяк P2P на дежурстве")
                          .setContentText("Ожидание сообщений (0% нагрузки CPU)")
                          .setOngoing(true)
                          .setPriority(NotificationCompat.PRIORITY_LOW)
                          .setContentIntent(pendingOpen)
                          .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Выключить и выйти", pendingStop)
                          .build()

                      if (Build.VERSION.SDK_INT >= 34) {
                          startForeground(9001, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                      } else {
                          startForeground(9001, notif)
                      }

                      val pm = getSystemService(Context.POWER_SERVICE) as? PowerManager
                      wakeLock = pm?.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Mayak::BgWakeLock")?.apply {
                          setReferenceCounted(false)
                          acquire()
                      }

                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                      if (wm != null && wm.isWifiEnabled) {
                          wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "Mayak::BgWifiLock")?.apply {
                              setReferenceCounted(false)
                              acquire()
                          }
                      }
                  } catch (_: Throwable) {}
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP_SERVICE) {
                      stopAndExitCompletely()
                      return START_NOT_STICKY
                  }
                  return START_STICKY
              }

              fun stopAndExitCompletely() {
                  try {
                      if (wakeLock?.isHeld == true) wakeLock?.release()
                      if (wifiLock?.isHeld == true) wifiLock?.release()
                  } catch (_: Throwable) {}
                  try {
                      Nearby.getConnectionsClient(applicationContext).stopAllEndpoints()
                      Nearby.getConnectionsClient(applicationContext).stopAdvertising()
                      Nearby.getConnectionsClient(applicationContext).stopDiscovery()
                  } catch (_: Throwable) {}
                  try {
                      MainActivity.currentInstance?.finishAffinity()
                  } catch (_: Throwable) {}
                  stopForeground(true)
                  stopSelf()
                  exitProcess(0)
              }

              override fun onDestroy() {
                  instance = null
                  try {
                      if (wakeLock?.isHeld == true) wakeLock?.release()
                      if (wifiLock?.isHeld == true) wifiLock?.release()
                  } catch (_: Throwable) {}
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }

          class MainActivity : FlutterActivity() {
              companion object {
                  var currentInstance: MainActivity? = null
              }

              private val CHANNEL = "mayak/native"
              private val NOTIF_CHANNEL_ID = "mayak_poco_high_alert_v3"
              private var methodChannel: MethodChannel? = null
              private var flutterEngineRef: FlutterEngine? = null
              private var multicastLock: WifiManager.MulticastLock? = null
              private var pendingPermResult: MethodChannel.Result? = null
              private var pendingFilePickResult: MethodChannel.Result? = null
              private var localNodeId: String = ""
              private var serviceId: String = "com.p2pmesh.intercom"
              private var notifIdCounter = 1001
              private var isAppInForeground = true

              private var mediaRecorder: MediaRecorder? = null
              private var currentVoiceFilePath: String? = null
              private var voiceStartMs: Long = 0L
              private var audioPlayer: MediaPlayer? = null
              private var currentAudioPath: String? = null

              private var videoTextureEntry: TextureRegistry.SurfaceTextureEntry? = null
              private var videoSurface: Surface? = null
              private var videoPlayer: MediaPlayer? = null

              private val connectedBleEndpoints = mutableSetOf<String>()
              private val mainHandler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  currentInstance = this
                  createNotificationChannel()
                  val defaultHandler = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
                      try {
                          mainHandler.post {
                              methodChannel?.invokeMethod("onNativeLog", "Перехвачена ошибка [${thread.name}]: ${throwable.message}")
                          }
                      } catch (_: Throwable) {}
                      if (thread.name != "main") {
                          return@setDefaultUncaughtExceptionHandler
                      }
                      defaultHandler?.uncaughtException(thread, throwable)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  isAppInForeground = true
              }

              override fun onPause() {
                  isAppInForeground = false
                  super.onPause()
              }

              override fun onStop() {
                  isAppInForeground = false
                  super.onStop()
              }

              private fun createNotificationChannel() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                          val audioAttr = AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION_COMMUNICATION_INSTANT)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build()
                          val channel = NotificationChannel(
                              NOTIF_CHANNEL_ID,
                              "Экстренные сообщения Маяк (POCO/MIUI)",
                              NotificationManager.IMPORTANCE_HIGH
                          ).apply {
                              description = "Пробивные уведомления о сообщениях со звуком и вибрацией"
                              enableVibration(true)
                              vibrationPattern = longArrayOf(0, 280, 120, 280)
                              lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                              setBypassDnd(true)
                              setSound(soundUri, audioAttr)
                          }
                          val nm = getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                          nm?.createNotificationChannel(channel)
                      }
                  } catch (_: Throwable) {}
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  flutterEngineRef = flutterEngine
                  val channel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                  methodChannel = channel

                  channel.setMethodCallHandler { call, result ->
                      try {
                          when (call.method) {
                              "getHardwareId" -> {
                                  val androidId = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: ""
                                  val model = "${Build.MANUFACTURER}_${Build.MODEL}"
                                  result.success("${androidId}_$model")
                              }
                              "getPersistentStorageDir" -> {
                                  val dir = File(filesDir, "mayak_received").apply { mkdirs() }
                                  result.success(dir.absolutePath)
                              }
                              "startBackgroundService" -> {
                                  startBgServiceSafe()
                                  result.success(true)
                              }
                              "stopBackgroundServiceAndExit" -> {
                                  result.success(true)
                                  MayakBackgroundService.instance?.stopAndExitCompletely() ?: run {
                                      finishAffinity()
                                      exitProcess(0)
                                  }
                              }
                              "pickFile" -> {
                                  val mode = call.argument<String>("mode") ?: "all"
                                  pendingFilePickResult = result
                                  val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                                      addCategory(Intent.CATEGORY_OPENABLE)
                                      putExtra(Intent.EXTRA_LOCAL_ONLY, true)
                                      when (mode) {
                                          "media" -> {
                                              type = "*/*"
                                              putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("image/*", "video/*"))
                                          }
                                          "audio" -> {
                                              type = "audio/*"
                                          }
                                          else -> {
                                              type = "*/*"
                                          }
                                      }
                                  }
                                  startActivityForResult(Intent.createChooser(intent, "Выберите медиа или файл"), 7004)
                              }
                              "openFileExternal" -> {
                                  val path = call.argument<String>("path") ?: ""
                                  val ok = openFileWithSystemViewer(path)
                                  result.success(ok)
                              }
                              "startVoiceRecord" -> {
                                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                      pendingPermResult = result
                                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 7005)
                                  } else {
                                      val started = startVoiceRecordingInternal()
                                      result.success(started)
                                  }
                              }
                              "stopVoiceRecord" -> {
                                  val info = stopVoiceRecordingInternal()
                                  result.success(info)
                              }
                              "playAudioFile" -> {
                                  val path = call.argument<String>("path") ?: ""
                                  val info = playAudioInternal(path)
                                  result.success(info)
                              }
                              "pauseAudioFile" -> {
                                  try { audioPlayer?.pause() } catch (_: Throwable) {}
                                  result.success(true)
                              }
                              "resumeAudioFile" -> {
                                  try { audioPlayer?.start() } catch (_: Throwable) {}
                                  result.success(true)
                              }
                              "seekAudioFile" -> {
                                  val posMs = call.argument<Int>("positionMs") ?: 0
                                  try { audioPlayer?.seekTo(posMs) } catch (_: Throwable) {}
                                  result.success(true)
                              }
                              "getAudioStatus" -> {
                                  val mp = audioPlayer
                                  if (mp != null) {
                                      result.success(mapOf(
                                          "isPlaying" to mp.isPlaying,
                                          "positionMs" to mp.currentPosition,
                                          "durationMs" to mp.duration.coerceAtLeast(1),
                                          "path" to (currentAudioPath ?: "")
                                      ))
                                  } else {
                                      result.success(null)
                                  }
                              }
                              "stopAudioFile" -> {
                                  stopAudioInternal()
                                  result.success(true)
                              }
                              "initInAppVideo" -> {
                                  val path = call.argument<String>("path") ?: ""
                                  val info = initInAppVideoInternal(path)
                                  result.success(info)
                              }
                              "controlInAppVideo" -> {
                                  val act = call.argument<String>("action") ?: ""
                                  val posMs = call.argument<Int>("positionMs") ?: 0
                                  val status = controlInAppVideoInternal(act, posMs)
                                  result.success(status)
                              }
                              "disposeInAppVideo" -> {
                                  disposeInAppVideoInternal()
                                  result.success(true)
                              }
                              "saveFileToDownloads" -> {
                                  val srcPath = call.argument<String>("path") ?: ""
                                  val fileName = call.argument<String>("name") ?: "mayak_file"
                                  val savedWhere = saveToPublicDownloads(srcPath, fileName)
                                  result.success(savedWhere)
                              }
                              "requestIgnoreBatteryOptimizations" -> {
                                  requestBatteryExemption()
                                  result.success(true)
                              }
                              "acquireMulticastLock" -> {
                                  acquireWifiMulticastLock()
                                  result.success(true)
                              }
                              "getWifiIpAndVpnState" -> {
                                  result.success(getWifiIpAndVpnInfo())
                              }
                              "requestNotificationPermission" -> {
                                  if (Build.VERSION.SDK_INT >= 33) {
                                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED) {
                                          result.success(true)
                                      } else {
                                          pendingPermResult = result
                                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 7003)
                                      }
                                  } else {
                                      result.success(true)
                                  }
                              }
                              "showNotification" -> {
                                  val title = call.argument<String>("title") ?: "Новое сообщение"
                                  val body = call.argument<String>("body") ?: ""
                                  val forceWhenOpen = call.argument<Boolean>("forceWhenOpen") ?: false
                                  if (!isAppInForeground || forceWhenOpen) {
                                      showSystemNotificationWithPocoBypass(title, body)
                                  }
                                  result.success(true)
                              }
                              "checkNearbyPermissions" -> {
                                  result.success(getMissingNearbyPermissions().isEmpty())
                              }
                              "requestNearbyPermissions" -> {
                                  val missing = getMissingNearbyPermissions()
                                  if (missing.isEmpty()) {
                                      result.success(true)
                                  } else {
                                      pendingPermResult = result
                                      ActivityCompat.requestPermissions(this, missing.toTypedArray(), 7001)
                                  }
                              }
                              "requestCameraPermission" -> {
                                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                                      result.success(true)
                                  } else {
                                      pendingPermResult = result
                                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CAMERA), 7002)
                                  }
                              }
                              "startNearby" -> {
                                  val nodeIdArg = call.argument<String>("nodeId") ?: "node"
                                  val srvIdArg = call.argument<String>("serviceId") ?: "com.p2pmesh.intercom"
                                  startNearbyMesh(nodeIdArg, srvIdArg, result)
                              }
                              "sendNearbyPayload" -> {
                                  val endpointId = call.argument<String>("endpointId") ?: ""
                                  val data = call.argument<String>("data") ?: ""
                                  sendPayloadSafe(endpointId, data)
                                  result.success(true)
                              }
                              "stopNearby" -> {
                                  stopNearbySafe()
                                  result.success(true)
                              }
                              else -> result.notImplemented()
                          }
                      } catch (t: Throwable) {
                          result.success("ERROR: ${t.message}")
                      }
                  }
              }

              private fun initInAppVideoInternal(path: String): Map<String, Any>? {
                  return try {
                      disposeInAppVideoInternal()
                      val engine = flutterEngineRef ?: return null
                      val entry = engine.renderer.createSurfaceTexture()
                      val surface = Surface(entry.surfaceTexture())
                      val mp = MediaPlayer()
                      mp.setDataSource(path)
                      mp.setSurface(surface)
                      mp.prepare()
                      val w = mp.videoWidth.coerceAtLeast(320)
                      val h = mp.videoHeight.coerceAtLeast(240)
                      entry.surfaceTexture().setDefaultBufferSize(w, h)
                      mp.start()

                      videoTextureEntry = entry
                      videoSurface = surface
                      videoPlayer = mp

                      mapOf(
                          "textureId" to entry.id(),
                          "width" to w,
                          "height" to h,
                          "durationMs" to mp.duration.coerceAtLeast(1)
                      )
                  } catch (_: Throwable) {
                      disposeInAppVideoInternal()
                      null
                  }
              }

              private fun controlInAppVideoInternal(action: String, posMs: Int): Map<String, Any>? {
                  val mp = videoPlayer ?: return null
                  return try {
                      when (action) {
                          "play" -> if (!mp.isPlaying) mp.start()
                          "pause" -> if (mp.isPlaying) mp.pause()
                          "seek" -> mp.seekTo(posMs.coerceIn(0, mp.duration.coerceAtLeast(1)))
                      }
                      mapOf(
                          "isPlaying" to mp.isPlaying,
                          "positionMs" to mp.currentPosition,
                          "durationMs" to mp.duration.coerceAtLeast(1)
                      )
                  } catch (_: Throwable) {
                      null
                  }
              }

              private fun disposeInAppVideoInternal() {
                  try { videoPlayer?.stop() } catch (_: Throwable) {}
                  try { videoPlayer?.release() } catch (_: Throwable) {}
                  videoPlayer = null
                  try { videoSurface?.release() } catch (_: Throwable) {}
                  videoSurface = null
                  try { videoTextureEntry?.release() } catch (_: Throwable) {}
                  videoTextureEntry = null
              }

              private fun startVoiceRecordingInternal(): Boolean {
                  return try {
                      stopVoiceRecordingInternal()
                      val outDir = File(filesDir, "voice_notes").apply { mkdirs() }
                      val outFile = File(outDir, "voice_${System.currentTimeMillis()}.m4a")
                      val recorder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          MediaRecorder(this)
                      } else {
                          @Suppress("DEPRECATION")
                          MediaRecorder()
                      }
                      recorder.setAudioSource(MediaRecorder.AudioSource.MIC)
                      recorder.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                      recorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                      recorder.setAudioSamplingRate(16000)
                      recorder.setAudioEncodingBitRate(24000)
                      recorder.setOutputFile(outFile.absolutePath)
                      recorder.prepare()
                      recorder.start()
                      mediaRecorder = recorder
                      currentVoiceFilePath = outFile.absolutePath
                      voiceStartMs = System.currentTimeMillis()
                      true
                  } catch (t: Throwable) {
                      mediaRecorder = null
                      false
                  }
              }

              private fun stopVoiceRecordingInternal(): Map<String, Any>? {
                  val rec = mediaRecorder ?: return null
                  val path = currentVoiceFilePath
                  mediaRecorder = null
                  currentVoiceFilePath = null
                  return try {
                      rec.stop()
                      rec.release()
                      val durSec = ((System.currentTimeMillis() - voiceStartMs) / 1000L).coerceAtLeast(1L)
                      if (path != null && File(path).exists() && File(path).length() > 0) {
                          mapOf(
                              "path" to path,
                              "name" to "Голосовое_${durSec}сек.m4a",
                              "size" to File(path).length(),
                              "durationSec" to durSec
                          )
                      } else null
                  } catch (_: Throwable) {
                      try { rec.release() } catch (_: Throwable) {}
                      null
                  }
              }

              private fun playAudioInternal(path: String): Map<String, Any>? {
                  return try {
                      if (currentAudioPath == path && audioPlayer != null) {
                          val mp = audioPlayer!!
                          if (mp.isPlaying) {
                              mp.pause()
                          } else {
                              mp.start()
                          }
                          return mapOf(
                              "isPlaying" to mp.isPlaying,
                              "positionMs" to mp.currentPosition,
                              "durationMs" to mp.duration.coerceAtLeast(1)
                          )
                      }
                      stopAudioInternal()
                      val mp = MediaPlayer()
                      mp.setDataSource(path)
                      mp.prepare()
                      mp.start()
                      currentAudioPath = path
                      mp.setOnCompletionListener {
                          mainHandler.post {
                              methodChannel?.invokeMethod("onAudioCompleted", path)
                          }
                      }
                      audioPlayer = mp
                      mapOf(
                          "isPlaying" to true,
                          "positionMs" to 0,
                          "durationMs" to mp.duration.coerceAtLeast(1)
                      )
                  } catch (_: Throwable) {
                      null
                  }
              }

              private fun stopAudioInternal() {
                  try { audioPlayer?.stop() } catch (_: Throwable) {}
                  try { audioPlayer?.release() } catch (_: Throwable) {}
                  audioPlayer = null
                  currentAudioPath = null
              }

              private fun openFileWithSystemViewer(path: String): Boolean {
                  return try {
                      val file = File(path)
                      if (!file.exists()) return false
                      val uri = FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
                      val ext = file.extension.lowercase(Locale.US)
                      val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext) ?: "*/*"
                      val intent = Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, mime)
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      startActivity(Intent.createChooser(intent, "Открыть файл"))
                      true
                  } catch (_: Throwable) {
                      false
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 7004) {
                      val res = pendingFilePickResult
                      pendingFilePickResult = null
                      if (res == null) return
                      if (resultCode != Activity.RESULT_OK || data?.data == null) {
                          res.success(null)
                          return
                      }
                      try {
                          val uri = data.data!!
                          var displayName = "file_${System.currentTimeMillis()}"
                          val cursor: Cursor? = contentResolver.query(uri, null, null, null, null)
                          cursor?.use {
                              if (it.moveToFirst()) {
                                  val idx = it.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                                  if (idx >= 0) {
                                      val rawName = it.getString(idx)
                                      if (!rawName.isNullOrBlank()) {
                                          displayName = rawName
                                      }
                                  }
                              }
                          }

                          val mime = contentResolver.getType(uri) ?: ""
                          if (!displayName.contains(".")) {
                              val ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mime)
                                  ?: when {
                                      mime.contains("jpeg") || mime.contains("jpg") -> "jpg"
                                      mime.contains("png") -> "png"
                                      mime.contains("webp") -> "webp"
                                      mime.contains("gif") -> "gif"
                                      mime.contains("mp4") -> "mp4"
                                      mime.contains("mkv") -> "mkv"
                                      mime.contains("webm") -> "webm"
                                      mime.contains("quicktime") || mime.contains("mov") -> "mov"
                                      mime.contains("mpeg") || mime.contains("mp3") -> "mp3"
                                      mime.contains("m4a") || mime.contains("mp4a") -> "m4a"
                                      mime.contains("wav") -> "wav"
                                      mime.contains("ogg") -> "ogg"
                                      mime.contains("pdf") -> "pdf"
                                      else -> "bin"
                                  }
                              displayName = "$displayName.$ext"
                          }

                          val safeName = displayName.replace(Regex("[^a-zA-Z0-9._а-яА-ЯёЁ-]"), "_")
                          val outDir = File(filesDir, "picked_files").apply { mkdirs() }
                          val outFile = File(outDir, "${System.currentTimeMillis()}_$safeName")
                          contentResolver.openInputStream(uri)?.use { input ->
                              FileOutputStream(outFile).use { output ->
                                  input.copyTo(output)
                              }
                          }
                          if (!outFile.exists() || outFile.length() == 0L) {
                              res.success(null)
                              return
                          }
                          res.success(
                              mapOf(
                                  "path" to outFile.absolutePath,
                                  "name" to displayName,
                                  "size" to outFile.length(),
                                  "mime" to mime
                              )
                          )
                      } catch (t: Throwable) {
                          mainHandler.post {
                              methodChannel?.invokeMethod("onNativeLog", "Ошибка чтения файла: ${t.message}")
                          }
                          res.success(null)
                      }
                  }
              }

              private fun saveToPublicDownloads(srcPath: String, fileName: String): String {
                  return try {
                      val srcFile = File(srcPath)
                      if (!srcFile.exists()) return "Файл не найден"
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.Downloads.DISPLAY_NAME, fileName)
                              put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Mayak")
                          }
                          val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                          if (uri != null) {
                              contentResolver.openOutputStream(uri)?.use { out ->
                                  srcFile.inputStream().use { input -> input.copyTo(out) }
                              }
                              "Сохранено в Загрузки/Mayak/$fileName"
                          } else {
                              "Ошибка сохранения"
                          }
                      } else {
                          val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "Mayak").apply { mkdirs() }
                          val dst = File(dir, fileName)
                          srcFile.copyTo(dst, true)
                          "Сохранено: ${dst.absolutePath}"
                      }
                  } catch (t: Throwable) {
                      "Ошибка: ${t.message}"
                  }
              }

              private fun startBgServiceSafe() {
                  try {
                      val intent = Intent(this, MayakBackgroundService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent)
                      } else {
                          startService(intent)
                      }
                  } catch (_: Throwable) {}
              }

              private fun requestBatteryExemption() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val pm = getSystemService(Context.POWER_SERVICE) as? PowerManager
                          if (pm != null && !pm.isIgnoringBatteryOptimizations(packageName)) {
                              val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                  data = Uri.parse("package:$packageName")
                              }
                              startActivity(intent)
                          }
                      }
                  } catch (_: Throwable) {}
              }

              private fun isLocationTurnedOn(): Boolean {
                  return try {
                      val lm = applicationContext.getSystemService(Context.LOCATION_SERVICE) as? LocationManager
                      if (lm == null) true
                      else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          lm.isLocationEnabled
                      } else {
                          lm.isProviderEnabled(LocationManager.GPS_PROVIDER) || lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER)
                      }
                  } catch (_: Throwable) {
                      true
                  }
              }

              private fun getWifiIpAndVpnInfo(): Map<String, Any> {
                  var wifiIp = ""
                  var vpnActive = false
                  try {
                      val wifi = applicationContext.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                      if (wifi != null && wifi.isWifiEnabled) {
                          val ipInt = wifi.connectionInfo?.ipAddress ?: 0
                          if (ipInt != 0) {
                              wifiIp = String.format(
                                  Locale.US,
                                  "%d.%d.%d.%d",
                                  ipInt and 0xff,
                                  ipInt shr 8 and 0xff,
                                  ipInt shr 16 and 0xff,
                                  ipInt shr 24 and 0xff
                              )
                          }
                      }
                  } catch (_: Throwable) {}

                  try {
                      val cm = applicationContext.getSystemService(Context.CONNECTIVITY_SERVICE) as? ConnectivityManager
                      if (cm != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val activeNet = cm.activeNetwork
                          val caps = cm.getNetworkCapabilities(activeNet)
                          if (caps != null && caps.hasTransport(NetworkCapabilities.TRANSPORT_VPN)) {
                              vpnActive = true
                          }
                      }
                  } catch (_: Throwable) {}

                  return mapOf(
                      "wifiIp" to wifiIp,
                      "vpnActive" to vpnActive,
                      "gpsEnabled" to isLocationTurnedOn()
                  )
              }

              private fun showSystemNotificationWithPocoBypass(title: String, body: String) {
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as? PowerManager
                      @Suppress("DEPRECATION")
                      val screenWake = pm?.newWakeLock(
                          PowerManager.SCREEN_DIM_WAKE_LOCK or PowerManager.ACQUIRE_CAUSES_WAKEUP,
                          "Mayak::AlertWakeUp"
                      )
                      screenWake?.acquire(3000L)
                  } catch (_: Throwable) {}

                  try {
                      val notifUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                      val ringtone = RingtoneManager.getRingtone(applicationContext, notifUri)
                      ringtone?.play()
                  } catch (_: Throwable) {}

                  try {
                      val vib = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vib?.vibrate(VibrationEffect.createWaveform(longArrayOf(0, 250, 120, 250), -1))
                      } else {
                          @Suppress("DEPRECATION")
                          vib?.vibrate(400)
                      }
                  } catch (_: Throwable) {}

                  try {
                      val intent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                      val pendingIntent = PendingIntent.getActivity(this, 0, intent, flags)

                      val builder = NotificationCompat.Builder(this, NOTIF_CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.stat_notify_chat)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setDefaults(NotificationCompat.DEFAULT_ALL)
                          .setFullScreenIntent(pendingIntent, true)
                          .setAutoCancel(true)
                          .setContentIntent(pendingIntent)

                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                      nm?.notify(notifIdCounter++, builder.build())
                  } catch (_: Throwable) {}
              }

              private fun acquireWifiMulticastLock() {
                  try {
                      val wifi = applicationContext.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                      if (wifi != null && wifi.isWifiEnabled && multicastLock == null) {
                          multicastLock = wifi.createMulticastLock("mayak_multicast_lock").apply {
                              setReferenceCounted(false)
                              acquire()
                          }
                      }
                  } catch (_: Throwable) {}
              }

              private fun getMissingNearbyPermissions(): List<String> {
                  val required = mutableListOf(
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  )
                  if (Build.VERSION.SDK_INT >= 31) {
                      required.add(Manifest.permission.BLUETOOTH_SCAN)
                      required.add(Manifest.permission.BLUETOOTH_ADVERTISE)
                      required.add(Manifest.permission.BLUETOOTH_CONNECT)
                  }
                  if (Build.VERSION.SDK_INT >= 33) {
                      required.add(Manifest.permission.NEARBY_WIFI_DEVICES)
                  }
                  return required.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  val res = pendingPermResult
                  pendingPermResult = null
                  if (res != null) {
                      try {
                          if (requestCode == 7001) {
                              res.success(getMissingNearbyPermissions().isEmpty())
                          } else if (requestCode == 7005) {
                              val granted = grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED
                              if (granted) {
                                  res.success(startVoiceRecordingInternal())
                              } else {
                                  res.success(false)
                              }
                          } else if (requestCode == 7002 || requestCode == 7003) {
                              val granted = grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED
                              res.success(granted)
                          } else {
                              res.success(false)
                          }
                      } catch (_: Throwable) {}
                  }
              }

              private val payloadCallback = object : PayloadCallback() {
                  override fun onPayloadReceived(endpointId: String, payload: Payload) {
                      try {
                          if (payload.type == Payload.Type.BYTES) {
                              val bytes = payload.asBytes() ?: return
                              val str = String(bytes, Charsets.UTF_8)
                              mainHandler.post {
                                  methodChannel?.invokeMethod(
                                      "onNearbyPayload",
                                      mapOf("endpointId" to endpointId, "data" to str)
                                  )
                              }
                          }
                      } catch (_: Throwable) {}
                  }

                  override fun onPayloadTransferUpdate(endpointId: String, update: PayloadTransferUpdate) {}
              }

              private val connectionLifecycleCallback = object : ConnectionLifecycleCallback() {
                  override fun onConnectionInitiated(endpointId: String, info: ConnectionInfo) {
                      try {
                          Nearby.getConnectionsClient(applicationContext)
                              .acceptConnection(endpointId, payloadCallback)
                      } catch (_: Throwable) {}
                  }

                  override fun onConnectionResult(endpointId: String, resolution: ConnectionResolution) {
                      try {
                          mainHandler.post {
                              if (resolution.status.isSuccess) {
                                  connectedBleEndpoints.add(endpointId)
                                  methodChannel?.invokeMethod("onNearbyConnected", endpointId)
                              } else {
                                  connectedBleEndpoints.remove(endpointId)
                                  methodChannel?.invokeMethod("onNearbyDisconnected", endpointId)
                              }
                          }
                      } catch (_: Throwable) {}
                  }

                  override fun onDisconnected(endpointId: String) {
                      try {
                          connectedBleEndpoints.remove(endpointId)
                          mainHandler.post {
                              methodChannel?.invokeMethod("onNearbyDisconnected", endpointId)
                          }
                      } catch (_: Throwable) {}
                  }
              }

              private val endpointDiscoveryCallback = object : EndpointDiscoveryCallback() {
                  override fun onEndpointFound(endpointId: String, info: DiscoveredEndpointInfo) {
                      try {
                          if (localNodeId.isNotEmpty() && localNodeId != info.endpointName && !connectedBleEndpoints.contains(endpointId)) {
                              val delayMs = if (localNodeId < info.endpointName) 100L else 2200L
                              mainHandler.postDelayed({
                                  try {
                                      if (!connectedBleEndpoints.contains(endpointId)) {
                                          Nearby.getConnectionsClient(applicationContext).requestConnection(
                                              localNodeId,
                                              endpointId,
                                              connectionLifecycleCallback
                                          )
                                      }
                                  } catch (_: Throwable) {}
                              }, delayMs)
                          }
                      } catch (_: Throwable) {}
                  }

                  override fun onEndpointLost(endpointId: String) {
                      try {
                          connectedBleEndpoints.remove(endpointId)
                          mainHandler.post {
                              methodChannel?.invokeMethod("onNearbyDisconnected", endpointId)
                          }
                      } catch (_: Throwable) {}
                  }
              }

              private fun startNearbyMesh(nodeIdArg: String, srvIdArg: String, result: MethodChannel.Result) {
                  val missing = getMissingNearbyPermissions()
                  if (missing.isNotEmpty()) {
                      result.success("MISSING_PERMISSIONS")
                      return
                  }
                  if (!isLocationTurnedOn()) {
                      mainHandler.post {
                          methodChannel?.invokeMethod("onNativeLog", "ВНИМАНИЕ: Включи значок Геолокации (GPS) в верхней шторке телефона для поиска по Bluetooth!")
                      }
                  }
                  localNodeId = nodeIdArg
                  serviceId = srvIdArg
                  try {
                      val client = Nearby.getConnectionsClient(applicationContext)
                      client.stopAdvertising()
                      client.stopDiscovery()

                      val advOptions = AdvertisingOptions.Builder()
                          .setStrategy(Strategy.P2P_CLUSTER)
                          .build()
                      val discOptions = DiscoveryOptions.Builder()
                          .setStrategy(Strategy.P2P_CLUSTER)
                          .build()

                      client.startAdvertising(
                          localNodeId,
                          serviceId,
                          connectionLifecycleCallback,
                          advOptions
                      ).addOnFailureListener { e ->
                          mainHandler.post {
                              methodChannel?.invokeMethod("onNativeLog", "BLE Advertising: ${e.message}")
                          }
                      }

                      client.startDiscovery(
                          serviceId,
                          endpointDiscoveryCallback,
                          discOptions
                      ).addOnFailureListener { e ->
                          mainHandler.post {
                              methodChannel?.invokeMethod("onNativeLog", "BLE Discovery: ${e.message}")
                          }
                      }

                      result.success("OK")
                  } catch (t: Throwable) {
                      result.success("ERROR: ${t.message}")
                  }
              }

              private fun sendPayloadSafe(endpointId: String, data: String) {
                  try {
                      val bytes = data.toByteArray(Charsets.UTF_8)
                      Nearby.getConnectionsClient(applicationContext)
                          .sendPayload(endpointId, Payload.fromBytes(bytes))
                  } catch (_: Throwable) {}
              }

              private fun stopNearbySafe() {
                  try {
                      connectedBleEndpoints.clear()
                      val client = Nearby.getConnectionsClient(applicationContext)
                      client.stopAdvertising()
                      client.stopDiscovery()
                      client.stopAllEndpoints()
                  } catch (_: Throwable) {}
              }

              override fun onDestroy() {
                  if (currentInstance == this) currentInstance = null
                  stopAudioInternal()
                  disposeInAppVideoInternal()
                  try {
                      multicastLock?.release()
                  } catch (_: Throwable) {}
                  super.onDestroy()
              }
          }
          """)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build Obfuscated Release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2p-mesh-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Flutter 3.27.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Create Windows platform folder
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=p2p_mesh .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Obfuscated Windows Release
        run: flutter build windows --release --obfuscate --split-debug-info=build/symbols

      - name: Create 1-Click Firewall Script for Public Network inside Release folder
        shell: cmd
        run: |
          echo @echo off > build\windows\x64\runner\Release\allow_public_network_firewall.bat
          echo chcp 65001 ^>nul >> build\windows\x64\runner\Release\allow_public_network_firewall.bat
          echo netsh advfirewall firewall delete rule name="Mayak P2P TCP 42070" ^>nul 2^>^&1 >> build\windows\x64\runner\Release\allow_public_network_firewall.bat
          echo netsh advfirewall firewall delete rule name="Mayak P2P UDP 42069" ^>nul 2^>^&1 >> build\windows\x64\runner\Release\allow_public_network_firewall.bat
          echo netsh advfirewall firewall add rule name="Mayak P2P TCP 42070" dir=in action=allow protocol=TCP localport=42070 profile=public,private,domain >> build\windows\x64\runner\Release\allow_public_network_firewall.bat
          echo netsh advfirewall firewall add rule name="Mayak P2P UDP 42069" dir=in action=allow protocol=UDP localport=42069 profile=public,private,domain >> build\windows\x64\runner\Release\allow_public_network_firewall.bat
          echo echo Готово! Порты Маяк P2P (42069 UDP / 42070 TCP) открыты для Общественной сети! >> build\windows\x64\runner\Release\allow_public_network_firewall.bat
          echo pause >> build\windows\x64\runner\Release\allow_public_network_firewall.bat

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: p2p-mesh-windows-pc
          path: build/windows/x64/runner/Release/
