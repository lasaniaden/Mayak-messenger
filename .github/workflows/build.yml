name: Build Android APK & Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Create Android platform folder & inject Permissions
        run: |
          flutter create --platforms=android --project-name=p2p_mesh .
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          perms = """
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
          """
          if "android.permission.CAMERA" not in content:
              content = content.replace("<application", perms + "\n    <application", 1)
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Configure Android SDK 36, minSdk 23, and Kotlin 2.1.0
        run: |
          python3 -c '
          import os, re
          for p in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(p):
                  with open(p, "r") as f:
                      c = f.read()
                  c = c.replace("flutter.minSdkVersion", "23")
                  c = c.replace("flutter.compileSdkVersion", "36")
                  c = re.sub(r"compileSdk\s*=?\s*\d+", "compileSdk = 36", c)
                  with open(p, "w") as f:
                      f.write(c)

          for s in ["android/settings.gradle", "android/settings.gradle.kts"]:
              if os.path.exists(s):
                  with open(s, "r") as f:
                      sc = f.read()
                  sc = re.sub(
                      r"(id\s+[\"\x27]org\.jetbrains\.kotlin\.android[\"\x27]\s+version\s+[\"\x27])[^\"\x27]+([\"\x27])",
                      r"\g<1>2.1.0\g<2>",
                      sc
                  )
                  with open(s, "w") as f:
                      f.write(sc)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2p-mesh-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Create Windows platform folder if missing
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=p2p_mesh .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: p2p-mesh-windows-pc
          path: build/windows/x64/runner/Release/
